<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>送信できました</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#18202a}
main{max-width:620px;margin:0 auto;padding:34px 18px}
.card{margin-top:8vh;background:#fff;border:1px solid #e5e9ef;border-radius:22px;padding:30px 22px;box-shadow:0 12px 36px rgba(20,35,55,.07)}
.dot{width:14px;height:14px;border-radius:50%;background:#16263a;animation:pulse 1.2s ease-in-out infinite;margin-bottom:20px}
@keyframes pulse{50%{opacity:.25;transform:scale(.8)}}
h1{font-size:25px;margin:0 0 12px}
p{font-size:16px;line-height:1.8;color:#4f5a67;margin:0}
.note{margin-top:18px;padding:14px;border-radius:12px;background:#f3f6fa;font-size:14px}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="dot"></div>
    <h1>送信できました</h1>
    <p>いま、必要な手続きと確認先を整理しています。この画面のままで大丈夫です。</p>
    <p class="note" id="note">準備ができたら、自動で結果画面へ移動します。</p>
  </div>
</main>
<script>
const params=new URLSearchParams(location.search);
const fragment=location.hash.startsWith('#')?location.hash.slice(1):'';
const fromQuery=params.get('instant_token')||'';
const remembered=sessionStorage.getItem('taishoku_instant_token')||'';
const token=fragment||fromQuery||remembered;
const valid=/^[A-Za-z0-9_-]{43}$/.test(token);
const note=document.getElementById('note');

if(valid){
  sessionStorage.setItem('taishoku_instant_token',token);
  history.replaceState(null,'',location.pathname);
}

if(!valid){
  note.textContent='専用番号を確認できませんでした。最初のページからもう一度お試しください。';
}else{
  const base='https://taishoku-workflow-production-free.onrender.com';
  const report=base+'/r/'+encodeURIComponent(token);
  const statusUrl=base+'/status/'+encodeURIComponent(token);
  const started=Date.now();
  let stopped=false;

  async function check(){
    if(stopped) return;
    const elapsed=Math.floor((Date.now()-started)/1000);
    if(elapsed>=20){
      note.textContent='まだ整理中です。この画面のままで大丈夫です。';
    }
    try{
      const res=await fetch(statusUrl,{cache:'no-store'});
      if(res.ok){
        const data=await res.json();
        if(data && (data.status==='ready' || data.status==='review_required')){
          stopped=true;
          note.textContent=data.status==='ready'
            ? '準備できました。結果を表示します…'
            : '次に確認することをまとめました。表示します…';
          setTimeout(()=>location.replace(report),350);
          return;
        }
      }
    }catch(_error){
      // Renderの無料環境が起動中でも、この静的画面に留めて再確認する。
    }
    if(elapsed>=90){
      note.textContent='少し時間がかかっています。引き続き確認しています。';
    }
    setTimeout(check,2000);
  }
  check();
}
</script>
</body>
</html>
