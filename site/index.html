<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BOAT EDGE</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=2">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">BOAT EDGE</div>
      <div id="dateMeta" class="muted">読み込み中…</div>
    </div>
    <div class="mode-badge">出走表 β</div>
  </header>

  <main>
    <section id="venueStrip" class="chips" aria-label="開催場"></section>
    <section id="raceStrip" class="chips race-chips" aria-label="レース"></section>

    <section class="race-box">
      <div id="raceHeader" class="race-header"></div>
      <nav id="viewTabs" class="view-tabs" aria-label="表示項目"></nav>
      <div id="tableWrap" class="table-wrap"></div>
      <div id="empty" class="empty hidden">表示できるレースがありません。</div>
    </section>

    <p class="footnote">独自指標は過去データからの集計値です。標本数が少ない項目は参考値として扱います。</p>
  </main>

  <script src="./app.js?v=2" defer></script>
</body>
</html>
