<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BOAT EDGE</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">BOAT EDGE</div>
      <div id="dateMeta" class="muted">読み込み中…</div>
    </div>
    <button id="detailToggle" class="ghost">独自データ ON</button>
  </header>
  <main>
    <section id="venueStrip" class="chips" aria-label="開催場"></section>
    <section id="raceStrip" class="chips race-chips" aria-label="レース"></section>
    <section id="raceHeader" class="race-header"></section>
    <section id="cards" class="cards"></section>
    <div id="empty" class="empty hidden">表示できるレースがありません。</div>
  </main>
  <template id="entryTemplate">
    <article class="entry-card">
      <div class="boat-rail"></div>
      <div class="entry-main">
        <div class="entry-head">
          <div class="boat-badge"></div>
          <div class="identity">
            <div class="name-row">
              <strong class="racer-name"></strong>
              <span class="grade"></span>
              <span class="trend-pill"></span>
            </div>
            <div class="subline"></div>
          </div>
        </div>
        <div class="metrics basic-metrics"></div>
        <div class="insights"></div>
      </div>
    </article>
  </template>
  <script src="./app.js" defer></script>
</body>
</html>
