<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>BOAT EDGE</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=3">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">BOAT EDGE</div>
      <div id="dateMeta" class="muted">読み込み中…</div>
    </div>
    <div class="mode-badge">分析 β</div>
  </header>

  <main>
    <section id="venueStrip" class="chips" aria-label="開催場"></section>
    <section id="raceStrip" class="chips race-chips" aria-label="レース"></section>

    <section class="race-box">
      <div id="raceHeader" class="race-header"></div>
      <nav id="viewTabs" class="view-tabs" aria-label="表示項目"></nav>
      <div id="tableWrap" class="table-wrap"></div>
      <div id="empty" class="empty hidden">表示できるレースがありません。</div>
    </section>

    <p class="footnote">補正勝率は研究用の推定値です。少数標本や期間で再現しない個別条件は当日補正に使用しません。</p>
  </main>

  <script src="./app.js?v=3" defer></script>
</body>
</html>
