<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>もっと高くない？</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#17181a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}main{max-width:860px;margin:auto;padding:24px 16px 70px}.top{display:flex;justify-content:space-between;font-weight:900}.v{font-size:12px;color:#6f7680}.hero{text-align:center;padding:34px 0 22px}.hero h1{font-size:clamp(36px,8vw,60px);line-height:1.02;margin:0 0 12px}.muted,.why{color:#6f7680;font-size:12px;line-height:1.6}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:20px;margin-top:14px;box-shadow:0 8px 30px #0000000b}textarea{width:100%;min-height:180px;border:1px solid #cfd4db;border-radius:14px;padding:15px;font:inherit;line-height:1.6}button{width:100%;border:0;background:#111827;color:#fff;border-radius:13px;padding:15px;font-weight:900;margin-top:10px}.sum{background:linear-gradient(#effff7,#fff)}.big{font-size:28px;font-weight:950}.row{display:grid;grid-template-columns:1.5fr .55fr .4fr;gap:10px;align-items:center;padding:14px 0;border-top:1px solid #e5e7eb}.row:first-child{border:0}.price{font-size:22px;font-weight:950}.delta{font-weight:900;color:#087f5b}.badge{display:inline-block;font-size:10px;background:#111827;color:white;border-radius:99px;padding:4px 7px;margin-left:6px}.ref{background:#8a5a00}.note{font-size:12px;color:#725300;background:#fff8e8;border:1px solid #f2dda0;border-radius:12px;padding:11px;margin-top:10px;line-height:1.6}@media(max-width:650px){.row{grid-template-columns:1fr auto}.row .delta{grid-column:2}}</style></head><body><main><div class="top"><div>もっと高くない？</div><div class="v">求人比較チェッカー v0.4.9</div></div><div class="hero"><h1>その求人、<br>もっと高くない？</h1><div class="muted">求人本文を貼る → 基本時給を正規化 → 同じ仕事率0〜99% → 高い募集を返す</div></div><section class="card"><textarea id="t">時給1,600円
東京都大田区 流通センター駅 徒歩4分
20:00～翌5:00
トレカの梱包、発送、PC入力
派遣社員</textarea><button id="b">この求人を比較する</button><div class="note">現在は検証データモード。本番はその都度Web検索する設計で、求人DBを答えの主軸にはしません。</div></section><div id="o"></div></main><script>
const J=[['TS26-0593423','パーソルテンプスタッフ',1900,'大田区','流通センター',1,'day',['09:00'],['トレカ'],['検品','照合','入力']],['TS26-0708244','パーソルテンプスタッフ',1750,'大田区','流通センター',1,'day',['09:00'],['トレカ'],['開梱','撮影','検品','梱包','発送','入力']],['TS26-0701826','パーソルテンプスタッフ',1840,'大田区','流通センター',5,'day',['08:00','09:00'],['トレカ'],['開梱','検品','梱包','発送','在庫管理','スキャン']],['BR26-0701405','パーソルフィールドスタッフ',1900,'大田区','流通センター',3,'night',['20:00'],['トレカ'],['検品','照合','入力']],['BR26-0701344','パーソルフィールドスタッフ',1900,'大田区','流通センター',3,'night',['20:00'],['トレカ'],['ラベル','封入','検品','圧着']],['TS26-0701780','パーソルテンプスタッフ',1750,'大田区','流通センター',4,'night',['20:00'],['トレカ'],['梱包','発送','入力']],['TS26-0687631','パーソルテンプスタッフ',1700,'江東区','潮見',10,'day',['09:00','10:00'],['スマホ'],['開梱','検品','仕分け']],['TS26-0676022','パーソルテンプスタッフ',1600,'江東区','潮見',10,'day',['09:00'],['スマホ'],['情報確認','入力','スキャン','初期化','発送']]];
const A={検品:['検品','チェック','キズ確認','照合'],梱包:['梱包','箱詰め'],発送:['発送','出荷','配送手配'],入力:['入力','データ入力','pc入力'],開梱:['開梱','開封'],撮影:['撮影'],仕分け:['仕分け'],スキャン:['スキャン','バーコード'],ラベル:['ラベル'],封入:['封入'],圧着:['圧着'],情報確認:['情報確認','情報チェック'],在庫管理:['在庫管理']};
const z=s=>s.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/，/g,',').replace(/：/g,':');
function parse(s){s=z(s);let w=null,m=s.replace(/,/g,'').match(/(?:通常時給|更新後時給|基本時給|時給換算|時給)\s*[:：]?\s*(\d{3,4})/);if(m)w=+m[1];let st=(s.match(/([一-龠ぁ-んァ-ヶーA-Za-z0-9]+)駅/)||[])[1]||null,wa=+(s.match(/徒歩\s*(\d+)\s*分/)||[])[1]||null,city=((s.match(/[一-龠ぁ-んァ-ヶー]{1,12}(?:市|区)/g)||[]).pop()||'').replace(/^東京都/,'')||null,shift=/夜勤|20:00|21:00|22:00|翌\s*\d/.test(s)?'night':/日勤|(?:^|\s)(?:8|9|10):\d{2}/.test(s)?'day':'unknown',starts=[...s.matchAll(/([0-2]?\d):(\d{2})\s*[～〜~-]/g)].map(x=>String(+x[1]).padStart(2,'0')+':'+x[2]),prod=[];for(let p of ['トレカ','スマホ','Amazon'])if(s.includes(p))prod.push(p);let tasks=[];for(let [k,v] of Object.entries(A))if(v.some(x=>s.toLowerCase().includes(x.toLowerCase())))tasks.push(k);return{w,st,wa,city,shift,starts,prod,tasks}}
const jac=(a,b)=>{if(!a.length||!b.length)return 0;let A=new Set(a),B=new Set(b),i=[...A].filter(x=>B.has(x)).length;return i/new Set([...A,...B]).size};
function sim(i,j){let [id,ag,w,city,st,wa,shift,starts,prod,tasks]=j,score=0,wt=0,add=(x,v)=>{wt+=x;score+=x*v};if(i.city){add(12,i.city===city?1:0)}if(i.st)add(28,i.st===st?1:0);if(i.wa!=null)add(7,Math.abs(i.wa-wa)<=2?1:Math.abs(i.wa-wa)<=5?.55:0);if(i.shift!='unknown')add(20,i.shift===shift?1:0);if(i.starts.length)add(8,i.starts.some(x=>starts.includes(x))?1:.35);let p=jac(i.prod,prod),t=jac(i.tasks,tasks);if(i.prod.length)add(18,p);if(i.tasks.length)add(32,t);let r=Math.round(score/wt*99);if(i.city&&i.city!==city)r=Math.min(r,45);if(i.st&&i.st!==st)r=Math.min(r,35);if(i.shift!='unknown'&&i.shift!==shift)r=Math.min(r,64);if(i.prod.length&&!p)r=Math.min(r,59);r=Math.max(0,Math.min(99,r));let site=Math.round(((i.city?i.city===city?1:0:0)+(i.st?i.st===st?1:0:0)+(i.wa!=null?Math.abs(i.wa-wa)<=2?1:Math.abs(i.wa-wa)<=5?.5:0:0))/((i.city?1:0)+(i.st?1:0)+(i.wa!=null?1:0)||1)*99),task=Math.round(t*99),tier=r>=85&&site>=85&&task>=55?'high':r>=70?'ref':'low';return{id,ag,w,city,st,wa,shift,tasks,r,site,task,tier}}
function run(){let i=parse(document.getElementById('t').value),rows=J.map(x=>sim(i,x)).sort((a,b)=>b.r-a.r||b.w-a.w),high=rows.filter(x=>x.tier==='high'),ref=rows.filter(x=>x.tier==='ref'),best=high.filter(x=>i.w&&x.w>i.w).sort((a,b)=>b.w-a.w)[0],h=`<section class="card sum"><div class="muted">結論</div><div class="big">${best?'もっと高い高一致求人があります':'高一致で、もっと高い求人は未確認'}</div><div class="why">基本時給 ${i.w?i.w.toLocaleString()+'円':'未取得'} / 高一致 ${high.length}件 / 参考 ${ref.length}件</div>${best?`<p><span class="price">${best.w.toLocaleString()}円</span> <span class="delta">+${(best.w-i.w).toLocaleString()}円/時</span><br><span class="why">${best.ag}・同じ仕事率 ${best.r}%・現場 ${best.site}%・工程 ${best.task}%</span></p>`:''}</section><section class="card"><b>同じ仕事候補</b>`;for(let x of [...high,...ref])h+=`<div class="row"><div><b>${x.ag}</b><span class="badge ${x.tier==='ref'?'ref':''}">${x.tier==='high'?'高一致':'参考'} ${x.r}%</span><div class="why">${x.st}駅 徒歩${x.wa}分 / ${x.shift==='night'?'夜勤':'日勤'} / ${x.tasks.join('・')}<br>現場 ${x.site}%・工程 ${x.task}%</div></div><div class="price">${x.w.toLocaleString()}円</div><div class="delta">${i.w?((x.w-i.w)>0?'+':'')+(x.w-i.w).toLocaleString()+'円':''}</div></div>`;h+=`<div class="note">断定条件：総合85〜99%＋現場85%以上＋工程55%以上。100%は表示しません。</div></section>`;document.getElementById('o').innerHTML=h}document.getElementById('b').onclick=run;run();
</script></body></html>
