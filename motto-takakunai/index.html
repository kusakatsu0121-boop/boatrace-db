function norm(s){return s.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/，/g,',').toLowerCase()}
function parse(s){s=norm(s);let m=s.replace(/,/g,'').match(/(?:基本時給|通常時給|時給)\s*[:：]?\s*(\d{3,4})/),st=(s.match(/([一-龠ぁ-んァ-ヶー]+)駅/)||[])[1]||'',city=((s.match(/[一-龠ぁ-んァ-ヶー]+(?:市|区)/g)||[]).pop()||'').replace(/^東京都/,''),wa=+(s.match(/徒歩\s*(\d+)\s*分/)||[])[1]||0,shift=/20:00|21:00|22:00|夜勤|翌/.test(s)?'night':'day',prod=s.includes('トレカ')||s.includes('トレーディングカード')?'トレカ':s.includes('スマホ')||s.includes('携帯')?'スマホ':'',tasks=[];for(const [k,vs] of Object.entries(aliases))if(vs.some(v=>s.includes(v)))tasks.push(k);return{w:m?+m[1]:null,st,city,wa,shift,prod,tasks}}
function taskScore(a,b){if(!a.length||!b.length)return{f1:0,mincov:0};let A=new Set(a),B=new Set(b),inter=[...A].filter(x=>B.has(x)).length,c1=inter/A.size,c2=inter/B.size;return{f1:2*inter/(A.size+B.size),mincov:Math.min(c1,c2)}}
