<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>もっと高くない？</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#17181a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}main{max-width:980px;margin:auto;padding:18px 14px 72px}.top{font-weight:950}.hero{text-align:center;padding:22px 0 12px}.hero h1{font-size:clamp(34px,8vw,56px);line-height:1.04;margin:0 0 9px}.muted{font-size:13px;color:#68707a;line-height:1.55}.card{background:#fff;border:1px solid #e2e5e9;border-radius:15px;padding:16px;margin-top:14px}textarea{width:100%;min-height:180px;border:1px solid #cbd1d8;border-radius:11px;padding:13px;font:inherit;line-height:1.5}.primary{width:100%;border:0;border-radius:10px;padding:14px;margin-top:9px;background:#111827;color:#fff;font-weight:900;cursor:pointer}.primary:disabled{opacity:.65;cursor:wait}.warn{font-size:11px;color:#735600;background:#fff8e8;border:1px solid #eedb9e;border-radius:9px;padding:9px;margin-top:9px;line-height:1.5}.answer{border:2px solid #9bddbf;background:#f3fff9}.delta{font-size:36px;font-weight:950;color:#087f5b}.price{font-size:18px;font-weight:900;margin-top:3px}.meta,.why{font-size:12px;color:#56606b;line-height:1.55;margin-top:7px}.row{border-top:1px solid #e8eaed;padding:13px 0}.row:first-child{border-top:0}.grid{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:8px}.label{font-size:10px;color:#7a818a}.value{font-weight:900}.good{color:#087f5b}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.chip{font-size:10px;background:#eef1f4;border-radius:999px;padding:4px 7px}.link{font-size:11px;margin-top:7px}.link a{color:#334155}.small{font-size:10px;color:#7b828b;line-height:1.5}.bad{background:#fff7e8;border-color:#f0d5a1}.perf{font-size:10px;color:#6b7280;margin-top:8px;line-height:1.55}.searching{display:flex;gap:8px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#111827;animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.25}}@media(max-width:620px){main{padding:12px 10px 60px}.hero h1{font-size:36px}.card{padding:12px}.grid{grid-template-columns:1fr 1fr 1fr}.delta{font-size:30px}}
</style>
</head>
<body><main>
<div class="top">もっと高くない？</div>
<div class="hero"><h1>その求人、<br>もっと高くない？</h1><div class="muted">求人本文を貼ると、同じ仕事の募集を探し、掲載中を確認できた候補だけを基本時給で比較します。</div></div>
<section class="card"><textarea id="input" placeholder="求人ページの本文を貼り付けてください。会社名・時給・勤務地・勤務時間・仕事内容が含まれているほど精度が上がります。"></textarea><button id="go" class="primary">もっと高い求人を探す</button><div class="warn">深夜割増・残業割増は基本時給に含めません。検索で見つけただけの求人は最高額にせず、詳細ページで掲載中を確認できた求人だけを使います。同じ仕事率は0〜99%で、100%表示はしません。</div></section>
<div id="out"></div>
</main>
<script>
const API_ENDPOINT='https://motto-takakunai-api.onrender.com/api/compare';
const SNAPSHOT_AT='2026-09-09T07:59:26+09:00',TTL_HOURS=24;
const C=[
{id:'TS260703097',company:'パーソルテンプスタッフ',w:1900,city:'大田区',station:'流通センター',shift:'night',product:'トレカ',role:'physical',tasks:['検品','照合','入力'],period:'2026年09月中旬～長期',verifiedAt:SNAPSHOT_AT,url:'https://www.tempstaff.co.jp/jbch/job/tokyo/13111/sd-66/TS260703097/'},
{id:'TS260674618',company:'パーソルテンプスタッフ',w:1900,city:'大田区',station:'流通センター',shift:'night',product:'トレカ',role:'physical',tasks:['検品','封入','梱包'],period:'2026年09月中旬～長期',verifiedAt:SNAPSHOT_AT,url:'https://www.tempstaff.co.jp/jbch/job/tokyo/13111/sd-66/TS260674618/'},
{id:'BR260639726',company:'パーソルフィールドスタッフ',w:1900,city:'大田区',station:'流通センター',shift:'night',product:'トレカ',role:'physical',tasks:['検品','入力','確認'],period:'2026年09月中旬～長期',verifiedAt:SNAPSHOT_AT,url:'https://www.tempstaff.co.jp/jbch/job/tokyo/13111/sd-66/BR260639726/'},
{id:'BR260572159',company:'パーソルフィールドスタッフ',w:1900,city:'大田区',station:'流通センター',shift:'day',product:'トレカ',role:'physical',tasks:['ケース収納','検品','圧着'],period:'2026年09月上旬～長期',verifiedAt:SNAPSHOT_AT,url:'https://www.tempstaff.co.jp/jbch/job/tokyo/13111/sd-66/BR260572159/'},
{id:'TS260708244',company:'パーソルテンプスタッフ',w:1750,city:'大田区',station:'流通センター',shift:'day',product:'トレカ',role:'physical',tasks:['開封','撮影','検品','発送'],period:'2026年10月上旬～長期',verifiedAt:SNAPSHOT_AT,url:'https://www.tempstaff.co.jp/jbch/job/tokyo/13111/sd-66/TS260708244/'},
{id:'TS260701398',company:'パーソルテンプスタッフ',w:1950,city:'大田区',station:'流通センター',shift:'day',product:'トレカ',role:'office',tasks:['問合せ','発送手配','不備確認'],period:'2026年10月上旬～長期',verifiedAt:SNAPSHOT_AT,url:'https://www.tempstaff.co.jp/jbch/job/tokyo/13111/sd-51/TS260701398/'},
{id:'TS260719667',company:'パーソルテンプスタッフ',w:1450,city:'大田区',station:'流通センター',shift:'day',product:'トレカ',role:'mixed',tasks:['梱包','撮影','入力'],period:'2026年10月上旬～長期',verifiedAt:SNAPSHOT_AT,url:'https://www.tempstaff.co.jp/jbch/job/tokyo/13111/sd-66/TS260719667/'},
{id:'RANDSTAD-FTKB109739',company:'ランスタッド',w:1600,city:'大田区',station:'流通センター',shift:'night',product:'食品',role:'physical',tasks:['梱包','検品'],period:'長期',verifiedAt:SNAPSHOT_AT,url:'https://www.randstad.co.jp/factory/detail/wnFTKB109739/'}
];
const aliases={検品:['検品','チェック','傷チェック','キズ','最終検品'],照合:['照合','ラベル内容','ラベル確認'],入力:['入力','データ入力','pc入力'],梱包:['梱包','箱詰め'],封入:['封入','ケース封入'],ケース収納:['ケース収納','ケースに入れる','ケースセット'],圧着:['圧着'],開封:['開封','開梱'],撮影:['撮影'],発送:['発送','出荷'],確認:['確認作業']};
function n(s=''){return String(s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/，/g,',').toLowerCase()}
function wage(s){s=n(s).replace(/,/g,'');let e=s.match(/(?:基本時給|通常時給)\s*[:：]?\s*(\d{3,4})/);if(e)return+e[1];let range=s.match(/時給\s*[:：]?\s*(\d{3,4})\s*(?:円)?\s*[～~-]\s*(\d{3,4})/);if(range)return+range[1];for(const m of s.matchAll(/時給\s*[:：]?\s*(\d{3,4})/g)){let pre=s.slice(Math.max(0,m.index-12),m.index);if(/(?:深夜|夜間|割増)\s*$/.test(pre))continue;return+m[1]}return null}
function company(s){for(const x of ['パーソルフィールドスタッフ','パーソルテンプスタッフ','ランスタッド','アデコ','パソナ','スタッフサービス'])if(s.includes(x.toLowerCase()))return x;let m=s.match(/(?:会社名|派遣会社|派遣元|企業名)\s*[:：]?\s*([^\n]{2,32})/);return m?m[1].trim():'会社名未取得'}
function tasks(s){let out=[];for(const[k,v]of Object.entries(aliases))if(v.some(x=>s.includes(x)))out.push(k);return[...new Set(out)]}
function parse(raw){let s=n(raw),ts=tasks(s),station=(s.match(/([一-龠ぁ-んァ-ヶー]+)駅/)||[])[1]||'',city=((s.match(/[一-龠ぁ-んァ-ヶー]+(?:市|区)/g)||[]).pop()||'').replace(/^東京都/,''),office=/一般事務|oa事務|問い合わせ対応|メール対応|人事|総務/.test(s);return{w:wage(s),company:company(s),city,station,shift:/20:00|21:00|22:00|夜勤|翌/.test(s)?'night':'day',product:/トレカ|トレーディングカード|キャラクターカード/.test(s)?'トレカ':/食品|魚|お魚/.test(s)?'食品':'',tasks:ts,role:office?'office':ts.length>=2?'physical':'mixed',period:/短期/.test(s)?'短期':/長期|3か月以上|3ヶ月以上/.test(s)?'長期':'期間未取得'}}
function fresh(x){let t=new Date(x.verifiedAt).getTime(),now=Date.now();return Number.isFinite(t)&&now>=t-300000&&now-t<=TTL_HOURS*3600000}
function rate(a,b){let A=new Set(a.tasks),B=new Set(b.tasks),inter=[...A].filter(x=>B.has(x)).length,f1=A.size&&B.size?2*inter/(A.size+B.size):0,site=!!a.city&&a.city===b.city,st=!!a.station&&a.station===b.station,sh=a.shift===b.shift,prod=!!a.product&&a.product===b.product,roleConflict=a.role!=='mixed'&&b.role!=='mixed'&&a.role!==b.role;let r=(site?25:0)+(st?20:0)+(sh?18:0)+(prod?15:0)+f1*22+(roleConflict?-24:4);if(!site)r=Math.min(r,35);if(!st)r=Math.min(r,49);if(!sh)r=Math.min(r,59);if(!prod)r=Math.min(r,54);if(roleConflict)r=Math.min(r,49);if(A.size<2)r=Math.min(r,69);return Math.max(0,Math.min(99,Math.round(r)))}
function fallbackWhy(a,b){let A=new Set(a.tasks),common=b.tasks.filter(x=>A.has(x));return[a.city===b.city?'✓ 勤務地':'△ 勤務地',a.station===b.station?'✓ 最寄駅':'△ 最寄駅',a.shift===b.shift?'✓ 時間帯':'△ 時間帯',a.product===b.product?'✓ 商材':'△ 商材',a.role===b.role||a.role==='mixed'||b.role==='mixed'?'✓ 職種系統':'△ 職種系統',common.length?`✓ 共通作業 ${common.join('・')}`:'△ 共通作業なし'].join(' / ')}
function reasonText(r={}){let parts=[];parts.push(r.cityMatch?'✓ 勤務地':'△ 勤務地');parts.push(r.stationMatch?'✓ 最寄駅':'△ 最寄駅');parts.push(r.shiftMatch?'✓ 時間帯':'△ 時間帯');parts.push(r.productMatch?'✓ 商材':'△ 商材');parts.push(r.roleMatch?'✓ 職種系統':'△ 職種系統');if(r.commonTasks?.length)parts.push(`✓ 共通作業 ${r.commonTasks.join('・')}`);return parts.join(' / ')}
function candidateRow(x,base){let w=Number(x.baseHourly??x.w),sr=Math.min(99,Number(x.sameWorkRate??x.rate??0)),why=x.sameWorkReasons?reasonText(x.sameWorkReasons):(x.why||''),period=x.period||'期間未取得';return`<div class="row"><div class="grid"><div><div class="label">会社</div><div class="value">${x.company||'会社名未取得'}</div></div><div><div class="label">基本時給</div><div class="value ${w>base.w?'good':''}">${w.toLocaleString()}円</div></div><div><div class="label">同じ仕事率</div><div class="value">${sr}%</div></div></div><div class="chips"><span class="chip">${x.shift==='night'?'夜勤':x.shift==='day'?'日勤':'時間帯不明'}</span><span class="chip">${x.product||'商材不明'}</span><span class="chip">${(x.tasks||[]).join('・')||'作業未取得'}</span></div><div class="why">${why}</div><div class="meta">期間：${base.period||'期間未取得'} → ${period}</div><div class="link"><a data-job-link href="${x.url}" target="_blank" rel="noopener">掲載中を確認した求人を見る</a></div></div>`}
function renderApi(data,base,t1){let o=document.getElementById('out'),best=data.bestHigher,head;if(best){let bw=Number(best.baseHourly);head=`<section class="card answer"><div class="delta">+${(bw-base.w).toLocaleString()}円/時</div><div class="price">${base.w.toLocaleString()}円 → ${bw.toLocaleString()}円</div><div class="meta">${base.company} → ${best.company||'比較先'} ／ 同じ仕事率 ${Math.min(99,Number(best.sameWorkRate||0))}%</div><div class="why">${reasonText(best.sameWorkReasons)}</div><div class="meta">期間：${base.period||'期間未取得'} → ${best.period||'期間未取得'}</div><div class="link"><a data-job-link href="${best.url}" target="_blank" rel="noopener">この求人を見る</a></div></section>`}else{head='<section class="card"><b>掲載中を確認できた求人の中では、より高い同じ仕事は見つかっていません。</b></section>'}let rows=(data.candidates||[]).length?`<section class="card"><b>同じ仕事候補</b>${data.candidates.map(x=>candidateRow(x,base)).join('')}</section>`:'';let s=data.search||{},c=data.counts||{};o.innerHTML=head+rows+`<div class="perf">検索候補 ${s.discoveredUrls??0}件 → 詳細確認 ${s.detailChecked??0}件 → 新規掲載確認 ${s.liveVerified??0}件 → 同じ仕事 ${c.sameWork??0}件 ／ T1 ${t1}秒 ／ ${data.mode||''}</div>`}
function renderFallback(base,t1,reason){let trusted=C.filter(fresh),rated=trusted.map(x=>({...x,rate:rate(base,x),why:fallbackWhy(base,x)})),same=rated.filter(x=>x.rate>=70).sort((a,b)=>b.w-a.w||b.rate-a.rate),byCompany=[];let seen=new Set();for(const x of same){if(!seen.has(x.company)){seen.add(x.company);byCompany.push(x)}}let best=byCompany.find(x=>x.w>base.w),o=document.getElementById('out'),head=best?`<section class="card answer"><div class="delta">+${(best.w-base.w).toLocaleString()}円/時</div><div class="price">${base.w.toLocaleString()}円 → ${best.w.toLocaleString()}円</div><div class="meta">${base.company} → ${best.company} ／ 同じ仕事率 ${best.rate}%</div><div class="why">${best.why}</div><div class="meta">期間：${base.period} → ${best.period}</div><div class="link"><a data-job-link href="${best.url}" target="_blank" rel="noopener">掲載中を確認した求人を見る</a></div></section>`:`<section class="card"><b>直近24時間の確認済み候補では、より高い同じ仕事は見つかっていません。</b></section>`;let rows=byCompany.length?`<section class="card"><b>同じ仕事候補</b>${byCompany.map(x=>candidateRow(x,base)).join('')}</section>`:'';o.innerHTML=head+rows+`<div class="perf">リアルタイム検索APIに接続できなかったため、直近確認済みスナップショットで比較しました。掲載確認済み ${trusted.length}件 ／ T1 ${t1}秒 ／ ${reason}</div>`}
async function run(){let raw=document.getElementById('input').value,base=parse(raw),o=document.getElementById('out'),btn=document.getElementById('go');if(!base.w){o.innerHTML='<section class="card bad"><b>基本時給を読み取れませんでした。</b><div class="small">深夜割増後の時給しかない場合は最高額比較をしません。通常時給が分かる求人本文を貼ってください。</div></section>';return}let t0=performance.now();btn.disabled=true;btn.textContent='掲載中の求人を確認中…';o.innerHTML='<section class="card searching"><span class="dot"></span><b>同じ仕事の候補を探して、詳細ページを確認しています。</b></section>';try{let res=await fetch(API_ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rawText:raw})});let data=await res.json();if(!res.ok||!data.ok)throw new Error(data.message||data.error||`HTTP ${res.status}`);renderApi(data,base,Math.round((performance.now()-t0)/100)/10)}catch(e){renderFallback(base,Math.round((performance.now()-t0)/100)/10,String(e.message||e))}finally{btn.disabled=false;btn.textContent='もっと高い求人を探す'}}
document.getElementById('go').onclick=run;
</script>
</body></html>
