<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>もっと高くない？</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#17181a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}main{max-width:1000px;margin:auto;padding:20px 14px 70px}.top{font-weight:900}.hero{text-align:center;padding:28px 0 18px}.hero h1{font-size:clamp(34px,8vw,58px);line-height:1.05;margin:0 0 10px}.muted{color:#69717c;font-size:13px}.card{background:#fff;border:1px solid #e4e7eb;border-radius:16px;padding:16px;margin-top:14px}textarea{width:100%;min-height:145px;border:1px solid #cbd1d8;border-radius:11px;padding:13px;font:inherit;line-height:1.55}button{width:100%;border:0;background:#111827;color:#fff;border-radius:10px;padding:14px;font-weight:900;margin-top:9px}.answer{border:2px solid #a8e2c7;background:#f3fff9}.answer .delta{font-size:34px;font-weight:950;color:#087f5b}.answer .price{font-size:21px;font-weight:900}.tableWrap{overflow-x:auto;margin-top:10px;border:1px solid #e4e7eb;border-radius:12px}.compare{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}.compare th,.compare td{padding:11px 10px;border-bottom:1px solid #e9ebee;text-align:left;white-space:nowrap}.compare th{background:#f8f9fa;font-size:11px;color:#69717c;position:sticky;top:0}.compare tr:last-child td{border-bottom:0}.compare .money{font-size:18px;font-weight:950}.compare .up{font-weight:900;color:#087f5b}.compare .base{background:#fafafa}.compare .best{background:#f2fff8}.pct{font-weight:900}.work{max-width:220px;white-space:normal!important;line-height:1.35}.sectionTitle{font-size:18px;font-weight:950;margin:0}.sectionSub{font-size:12px;color:#69717c;margin-top:3px}.other{opacity:.92}.tag{display:inline-block;padding:3px 7px;border-radius:99px;background:#e9f8f1;color:#087f5b;font-size:10px;font-weight:900}.tag.other{background:#f1f2f4;color:#5d6570}.foot{font-size:11px;color:#7b828b;margin-top:12px;line-height:1.5}@media(max-width:600px){main{padding:16px 10px 60px}.hero{padding:24px 0 14px}.card{padding:13px}.answer .delta{font-size:30px}.tableWrap{margin-left:-13px;margin-right:-13px;border-radius:0;border-left:0;border-right:0}.compare th:first-child,.compare td:first-child{position:sticky;left:0;z-index:2;background:#fff;box-shadow:2px 0 4px #0000000b}.compare th:first-child{background:#f8f9fa}.compare .best td:first-child{background:#f2fff8}.compare .base td:first-child{background:#fafafa}}</style></head><body><main><div class="top">もっと高くない？</div><div class="hero"><h1>その求人、<br>もっと高くない？</h1><div class="muted">求人を貼るだけ。同じ仕事の募集を横一列で比較します。</div></div><section class="card"><textarea id="t">時給1,600円
東京都大田区 流通センター駅 徒歩4分
20:00～翌5:00
トレカの梱包、発送、PC入力
派遣社員</textarea><button id="b">もっと高い求人を探す</button></section><div id="o"></div></main><script>
const J=[['パーソルフィールドスタッフ',1900,'大田区','流通センター',3,'night',['検品','照合','入力']],['パーソルフィールドスタッフ',1900,'大田区','流通センター',3,'night',['ラベル','封入','検品','圧着']],['パーソルテンプスタッフ',1750,'大田区','流通センター',4,'night',['梱包','発送','入力']],['パーソルテンプスタッフ',1900,'大田区','流通センター',1,'day',['検品','照合','入力']],['パーソルテンプスタッフ',1840,'大田区','流通センター',5,'day',['開梱','検品','梱包','発送','在庫管理','スキャン']],['パーソルテンプスタッフ',1750,'大田区','流通センター',1,'day',['開梱','撮影','検品','梱包','発送','入力']],['パーソルテンプスタッフ',1700,'江東区','潮見',10,'day',['開梱','検品','仕分け']],['パーソルテンプスタッフ',1600,'江東区','潮見',10,'day',['情報確認','入力','スキャン','初期化','発送']]];
const keys=['検品','梱包','発送','入力','開梱','開封','撮影','仕分け','スキャン','ラベル','封入','圧着','照合','在庫管理','情報確認','初期化'];function parse(s){s=s.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));let m=s.replace(/,/g,'').match(/時給\s*[:：]?\s*(\d{3,4})/),st=(s.match(/([一-龠ぁ-んァ-ヶー]+)駅/)||[])[1]||'',city=((s.match(/[一-龠ぁ-んァ-ヶー]+(?:市|区)/g)||[]).pop()||'').replace(/^東京都/,''),wa=+(s.match(/徒歩\s*(\d+)\s*分/)||[])[1]||0,shift=/20:00|21:00|22:00|夜勤|翌/.test(s)?'night':'day',tasks=keys.filter(k=>s.toLowerCase().includes(k.toLowerCase()));if(s.includes('PC入力')&&!tasks.includes('入力'))tasks.push('入力');return{w:m?+m[1]:null,st,city,wa,shift,tasks}}
function jac(a,b){if(!a.length||!b.length)return 0;let A=new Set(a),B=new Set(b),i=[...A].filter(x=>B.has(x)).length;return i/new Set([...A,...B]).size}function classify(i,j){let [ag,w,city,st,wa,shift,tasks]=j,t=jac(i.tasks,tasks),sameSite=i.city===city&&i.st===st,sameShift=i.shift===shift,rate=Math.min(99,Math.round((sameSite?38:0)+(sameShift?20:0)+t*41));let exact=sameSite&&sameShift&&t>=.5&&rate>=78;return{ag,w,city,st,wa,shift,tasks,t,rate,exact}}
function tr(x,i,cls=''){let d=x.w-i.w;return `<tr class="${cls}"><td><b>${x.ag}</b></td><td class="money">${x.w.toLocaleString()}円</td><td class="${d>0?'up':''}">${d===0?'基準':(d>0?'+':'')+d.toLocaleString()+'円'}</td><td class="pct">${x.rate!=null?x.rate+'%':'—'}</td><td class="work">${x.tasks.join('・')}</td><td>${x.shift==='night'?'夜勤':'日勤'}</td><td>${x.st} 徒歩${x.wa}分</td></tr>`}function table(rows,i,base){let h=`<div class="tableWrap"><table class="compare"><thead><tr><th>会社</th><th>時給</th><th>差額</th><th>同じ仕事率</th><th>作業内容</th><th>時間帯</th><th>勤務地</th></tr></thead><tbody>`;if(base)h+=tr({ag:'あなたの求人',w:i.w,rate:null,tasks:i.tasks,shift:i.shift,st:i.st,wa:i.wa},i,'base');rows.forEach((x,n)=>h+=tr(x,i,n===0&&x.w>i.w?'best':''));return h+'</tbody></table></div>'}
function run(){let i=parse(t.value),all=J.map(j=>classify(i,j)),same=all.filter(x=>x.exact).sort((a,b)=>b.w-a.w||b.rate-a.rate),other=all.filter(x=>!x.exact&&x.city===i.city&&x.st===i.st).sort((a,b)=>b.w-a.w),best=same.find(x=>i.w&&x.w>i.w);let h=`<section class="card answer"><div class="muted">結論</div>${best?`<div class="delta">+${(best.w-i.w).toLocaleString()}円/時</div><div class="price">同じ仕事で最高 ${best.w.toLocaleString()}円</div><div class="muted">同じ仕事率 ${best.rate}%　${best.ag}</div>`:`<div class="price">同じ仕事でもっと高い求人は未確認</div>`}</section><section class="card"><div class="sectionTitle">同じ仕事を一目で比較</div><div class="sectionSub">作業内容・勤務地・勤務帯が一致する候補だけ</div>${table(same,i,true)}</section>`;if(other.length)h+=`<section class="card other"><div class="sectionTitle">似ている別の仕事</div><div class="sectionSub">作業内容が違うため「もっと高い同じ仕事」には含めません</div>${table(other,i,false)}</section>`;h+=`<div class="foot">同じ仕事率は最大99%。現在は検証データモードです。</div>`;o.innerHTML=h}b.onclick=run;run();
</script></body></html>
