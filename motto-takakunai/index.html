</main><script>

function n(s=''){return String(s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/，/g,',').toLowerCase()}
function wage(s){s=n(s).replace(/,/g,'');let e=s.match(/(?:基本時給|通常時給)\s*[:：]?\s*(\d{3,4})/);if(e)return+e[1];let range=s.match(/時給\s*[:：]?\s*(\d{3,4})\s*(?:円)?\s*[～~-]\s*(\d{3,4})/);if(range){let a=+range[1],b=+range[2];if(Math.abs(b/a-1.25)<.03)return a;return a}for(const m of s.matchAll(/時給\s*[:：]?\s*(\d{3,4})/g)){let pre=s.slice(Math.max(0,m.index-12),m.index);if(/(?:深夜|夜間|割増)\s*$/.test(pre))continue;return+m[1]}return null}
function company(s){for(const x of ['パーソルフィールドスタッフ','パーソルテンプスタッフ','ランスタッド','アデコ','パソナ','スタッフサービス'])if(s.includes(x.toLowerCase()))return x;let m=s.match(/(?:会社名|派遣会社|派遣元|企業名)\s*[:：]?\s*([^\n]{2,32})/);return m?m[1].trim():'会社名未取得'}
function tasks(s){let out=[];for(const[k,v]of Object.entries(aliases))if(v.some(x=>s.includes(x)))out.push(k);return[...new Set(out)]}
function parse(raw){let s=n(raw),ts=tasks(s),station=(s.match(/([一-龠ぁ-んァ-ヶー]+)駅/)||[])[1]||'',city=((s.match(/[一-龠ぁ-んァ-ヶー]+(?:市|区)/g)||[]).pop()||'').replace(/^東京都/,''),office=/一般事務|oa事務|問い合わせ対応|メール対応|人事|総務/.test(s);return{w:wage(s),company:company(s),city,station,shift:/20:00|21:00|22:00|夜勤|翌/.test(s)?'night':'day',product:/トレカ|トレーディングカード|キャラクターカード/.test(s)?'トレカ':/食品|魚|お魚/.test(s)?'食品':'',tasks:ts,role:office?'office':ts.length>=2?'physical':'mixed',period:/短期/.test(s)?'短期':/長期|3か月以上|3ヶ月以上/.test(s)?'長期':'',emp:/紹介予定派遣/.test(s)?'紹介予定派遣':/派遣/.test(s)?'派遣':/契約社員/.test(s)?'契約社員':/正社員/.test(s)?'正社員':/アルバイト|パート/.test(s)?'アルバイト・パート':'',transport:/交通費[^\n]{0,20}(全額|支給)/.test(s)?'支給あり':'未確認'}}
function fresh(x){let t=new Date(x.verifiedAt).getTime(),now=Date.now();return Number.isFinite(t)&&now>=t-300000&&now-t<=TTL_HOURS*3600000}
function rate(a,b){let A=new Set(a.tasks),B=new Set(b.tasks),inter=[...A].filter(x=>B.has(x)).length,f1=A.size&&B.size?2*inter/(A.size+B.size):0,site=!!a.city&&a.city===b.city,st=!!a.station&&a.station===b.station,sh=a.shift===b.shift,prod=!!a.product&&a.product===b.product,roleConflict=a.role!=='mixed'&&b.role!=='mixed'&&a.role!==b.role,periodConflict=a.period&&b.period&&a.period!==b.period;let r=(site?25:0)+(st?20:0)+(sh?18:0)+(prod?15:0)+f1*22+(roleConflict?-24:4)+(periodConflict?-5:0);if(!site)r=Math.min(r,35);if(!st)r=Math.min(r,49);if(!sh)r=Math.min(r,59);if(!prod)r=Math.min(r,54);if(roleConflict)r=Math.min(r,49);if(A.size<2)r=Math.min(r,69);return Math.max(0,Math.min(99,Math.round(r)))}
function why(a,b){let A=new Set(a.tasks),common=b.tasks.filter(x=>A.has(x));return[a.city===b.city?'✓ 勤務地':'△ 勤務地',a.station===b.station?'✓ 最寄駅':'△ 最寄駅',a.shift===b.shift?'✓ 時間帯':'△ 時間帯',a.product===b.product?'✓ 商材':'△ 商材',a.role===b.role||a.role==='mixed'||b.role==='mixed'?'✓ 職種系統':'△ 職種系統',common.length?`✓ 共通作業 ${common.join('・')}`:'△ 共通作業なし'].join(' / ')}
function dedupe(rows){let byCompany=new Map();for(const x of rows.sort((a,b)=>b.w-a.w||b.rate-a.rate)){if(!byCompany.has(x.company))byCompany.set(x.company,x)}return[...byCompany.values()]}
function render(){let t0=performance.now(),a=parse(document.getElementById('input').value),o=document.getElementById('out');if(!a.w){o.innerHTML='<section class="card bad"><b>基本時給を読み取れませんでした。</b><div class="small">深夜割増後の時給しかない場合は最高額比較をしません。</div></section>';return}let trusted=C.filter(fresh),rated=trusted.map(x=>({...x,rate:rate(a,x),why:why(a,x)})),same=dedupe(rated.filter(x=>x.rate>=70)),best=same.find(x=>x.w>a.w),dt=Math.round((performance.now()-t0)*10)/10;let head=best?`<section class="card answer"><div class="delta">+${(best.w-a.w).toLocaleString()}円/時</div><div class="price">${a.w.toLocaleString()}円 → ${best.w.toLocaleString()}円</div><div class="meta">${a.company} → ${best.company} ／ 同じ仕事率 ${best.rate}%</div><div class="why">${best.why}</div><div class="link"><a data-job-link href="${best.url}" target="_blank" rel="noopener">掲載中を確認した求人を見る</a></div></section>`:`<section class="card"><b>掲載中を確認した候補の中では、より高い同じ仕事は見つかっていません。</b></section>`;let rows=same.length?`<section class="card"><b>同じ仕事候補</b>${same.map(x=>`<div class="row"><div class="grid"><div><div class="label">会社</div><div class="value">${x.company}</div></div><div><div class="label">基本時給</div><div class="value">${x.w.toLocaleString()}円</div></div><div><div class="label">同じ仕事率</div><div class="value ${x.w>a.w?'good':''}">${x.rate}%</div></div></div><div class="chips"><span class="chip">${x.shift==='night'?'夜勤':'日勤'}</span><span class="chip">${x.product||'商材不明'}</span><span class="chip">${x.tasks.join('・')}</span></div><div class="why">${x.why}</div><div class="link"><a data-job-link href="${x.url}" target="_blank" rel="noopener">求人を見る</a></div></div>`).join('')}</section>`:'';o.innerHTML=head+rows+`<div class="perf">掲載確認済み ${trusted.length}件 ／ 比較処理 ${dt}ms ／ snapshot ${SNAPSHOT_AT}</div>`}
