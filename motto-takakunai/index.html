<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>もっと高くない？</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#17181a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}main{max-width:980px;margin:auto;padding:18px 14px 70px}.top{font-weight:900}.hero{text-align:center;padding:22px 0 10px}.hero h1{font-size:clamp(34px,8vw,56px);line-height:1.04;margin:0 0 10px}.muted{color:#68707a;font-size:13px;line-height:1.55}.card{background:#fff;border:1px solid #e2e5e9;border-radius:15px;padding:16px;margin-top:14px}textarea{width:100%;min-height:185px;border:1px solid #cbd1d8;border-radius:11px;padding:13px;font:inherit;line-height:1.5}.primary{width:100%;border:0;background:#111827;color:#fff;border-radius:10px;padding:14px;font-weight:900;margin-top:9px}.warn{font-size:11px;color:#745600;background:#fff8e8;border:1px solid #eedb9e;border-radius:9px;padding:9px;margin-top:9px}.answer{border:2px solid #9bddbf;background:#f3fff9}.delta{font-size:34px;font-weight:950;color:#087f5b}.price{font-size:18px;font-weight:900;margin-top:3px}.meta{font-size:12px;color:#55615c;line-height:1.6;margin-top:8px}.row{border-top:1px solid #e8eaed;padding:13px 0}.row:first-child{border-top:0}.grid{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:8px}.label{font-size:10px;color:#7a818a}.value{font-weight:900}.good{color:#087f5b}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:10px;background:#eef1f4;border-radius:999px;padding:4px 7px}.why{font-size:11px;color:#56606b;line-height:1.5;margin-top:7px}.link{font-size:11px;margin-top:7px}.link a{color:#334155}.small{font-size:10px;color:#7b828b;line-height:1.45}.bad{background:#fff7e8;border-color:#f0d5a1}.empty{font-size:14px;font-weight:800}.perf{font-size:10px;color:#6b7280;margin-top:8px}@media(max-width:620px){main{padding:12px 10px 60px}.hero h1{font-size:36px}.card{padding:12px}.grid{grid-template-columns:1fr 1fr 1fr}.delta{font-size:30px}}
</style></head><body><main><div class="top">もっと高くない？</div><div class="hero"><h1>その求人、<br>もっと高くない？</h1><div class="muted">求人本文を貼ると、掲載中を確認した候補だけを基本時給で比較します。</div></div>
<section class="card"><textarea id="input" placeholder="求人ページの本文を貼り付けてください。会社名・時給・勤務地・勤務時間・仕事内容が含まれているほど精度が上がります。"></textarea><button id="go" class="primary">もっと高い求人を探す</button><div class="warn">深夜割増・残業割増は基本時給に含めません。掲載確認から24時間を超えた候補は最高額判定から除外します。同じ仕事率は0〜99%で、100%表示はしません。</div></section><div id="out"></div></main>
<script>
const SNAPSHOT_AT='2026-09-09T05:55:46+09:00',TTL_HOURS=24;
const C=[

{id:'BR260701344',company:'パーソルフィールドスタッフ',w:1900,city:'大田区',station:'流通センター',shift:'night',product:'トレカ',role:'physical',tasks:['封入','検品','ラベル貼り'],period:'長期',emp:'派遣',transport:'全額支給',verifiedAt:SNAPSHOT_AT,url:'https://www.tempstaff.co.jp/jbch/job/tokyo/13111/sd-66/BR260701344/'},
{id:'BR260701235',company:'パーソルフィールドスタッフ',w:1800,city:'大田区',station:'流通センター',shift:'night',product:'トレカ',role:'physical',tasks:['棚入れ','入荷','仕分け'],period:'長期',emp:'派遣',transport:'全額支給',verifiedAt:SNAPSHOT_AT,url:'https://www.tempstaff.co.jp/jbch/job/tokyo/13111/sd-66/BR260701235/'},
{id:'RANDSTAD-R032701-KJ108',company:'ランスタッド',w:1750,city:'大田区',station:'流通センター',shift:'night',product:'トレカ',role:'physical',tasks:['ケースセット','検品','梱包'],period:'長期',emp:'派遣',transport:'支給あり',verifiedAt:SNAPSHOT_AT,url:'https://www.randstad.co.jp/factory/r032701/kj108/'},
{id:'TS260701398',company:'パーソルテンプスタッフ',w:1950,city:'大田区',station:'流通センター',shift:'day',product:'トレカ',role:'office',tasks:['問合せ','発送手配','不備確認'],period:'長期',emp:'派遣',transport:'全額支給',verifiedAt:SNAPSHOT_AT,url:'https://www.tempstaff.co.jp/jbch/job/tokyo/13111/sd-51/TS260701398/'},
{id:'RANDSTAD-FTKB109739',company:'ランスタッド',w:1600,city:'大田区',station:'流通センター',shift:'night',product:'食品',role:'physical',tasks:['梱包','検品'],period:'長期',emp:'派遣',transport:'未確認',verifiedAt:SNAPSHOT_AT,url:'https://www.randstad.co.jp/factory/detail/wnFTKB109739/'},
{id:'RANDSTAD-FFBS112655',company:'ランスタッド',w:1400,city:'船橋市',station:'南船橋',shift:'night',product:'日用品',role:'physical',tasks:['ピッキング','検品','入出荷'],period:'長期',emp:'派遣',transport:'未確認',verifiedAt:SNAPSHOT_AT,url:'https://www.randstad.co.jp/factory/detail/wnFFBS112655/'}];
const aliases={検品:['検品','チェック','確認','傷チェック','キズ'],照合:['照合','ラベル内容','ラベル確認'],入力:['入力','データ入力','pc入力'],梱包:['梱包','箱詰め'],封入:['封入','ケース封入'],ケースセット:['ケースセット','ケースにセット'],ラベル貼り:['ラベル貼り','ラベルを貼'],棚入れ:['棚入れ'],入荷:['入荷'],仕分け:['仕分け'],問合せ:['問い合わせ','お問い合わせ'],発送手配:['発送手配'],不備確認:['不備確認','不備チェック'],ピッキング:['ピッキング'],入出荷:['入出荷']};
function n(s=''){return String(s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/，/g,',').toLowerCase()}
function wage(s){s=n(s).replace(/,/g,'');let e=s.match(/(?:基本時給|通常時給)\s*[:：]?\s*(\d{3,4})/);if(e)return +e[1];let r=s.match(/時給\s*[:：]?\s*(\d{3,4})\s*(?:円)?\s*[～~-]\s*(\d{3,4})/);if(r){let a=+r[1],b=+r[2];if(/夜勤|深夜|22時|翌\s*5時|20:00|21:00|22:00/.test(s)&&Math.abs(b/a-1.25)<.03)return a;return a}for(const m of s.matchAll(/時給\s*[:：]?\s*(\d{3,4})/g)){let pre=s.slice(Math.max(0,m.index-10),m.index);if(/(?:深夜|夜間|割増)\s*$/.test(pre))continue;return +m[1]}return null}
function company(s){for(const x of ['パーソルフィールドスタッフ','パーソルテンプスタッフ','ランスタッド','アデコ','パソナ','スタッフサービス'])if(s.includes(x.toLowerCase()))return x;let m=s.match(/(?:会社名|派遣会社|派遣元|企業名)\s*[:：]?\s*([^\n]{2,32})/);return m?m[1].trim():'会社名未取得'}
function tasks(s){let out=[];for(const [k,v] of Object.entries(aliases))if(v.some(x=>s.includes(x)))out.push(k);return [...new Set(out)]}
function parse(raw){let s=n(raw),w=wage(s),station=(s.match(/([一-龠ぁ-んァ-ヶー]+)駅/)||[])[1]||'',city=((s.match(/[一-龠ぁ-んァ-ヶー]+(?:市|区)/g)||[]).pop()||'').replace(/^東京都/,''),shift=/20:00|21:00|22:00|夜勤|翌/.test(s)?'night':'day',product=/トレカ|トレーディングカード/.test(s)?'トレカ':/食品|魚|お魚/.test(s)?'食品':/日用品/.test(s)?'日用品':'',ts=tasks(s),office=/一般事務|oa事務|問い合わせ対応|メール対応/.test(s),role=office?'office':ts.length>=2?'physical':'mixed',period=/短期/.test(s)?'短期':/長期|3か月以上|3ヶ月以上/.test(s)?'長期':'',emp=/紹介予定派遣/.test(s)?'紹介予定派遣':/派遣/.test(s)?'派遣':/契約社員/.test(s)?'契約社員':/正社員/.test(s)?'正社員':/アルバイト|パート/.test(s)?'アルバイト・パート':'',transport=/交通費[^\n]{0,15}(全額|支給)/.test(s)?'支給あり':'未確認';return{raw,s,w,company:company(s),city,station,shift,product,tasks:ts,role,period,emp,transport}}
function fresh(x){return Date.now()-new Date(x.verifiedAt).getTime()<=TTL_HOURS*3600000 && Date.now()>=new Date(x.verifiedAt).getTime()-300000}
function rate(a,b){let A=new Set(a.tasks),B=new Set(b.tasks),inter=[...A].filter(x=>B.has(x)).length,f1=A.size&&B.size?2*inter/(A.size+B.size):0,site=a.city&&b.city&&a.city===b.city,st=a.station&&b.station&&a.station===b.station,sh=a.shift===b.shift,prod=a.product&&b.product&&a.product===b.product,roleConflict=a.role!=='mixed'&&b.role!=='mixed'&&a.role!==b.role,periodConflict=a.period&&b.period&&a.period!==b.period;let r=(site?25:0)+(st?20:0)+(sh?18:0)+(prod?15:0)+f1*22+(roleConflict?-24:4)+(periodConflict?-5:0);if(!site)r=Math.min(r,35);if(!st)r=Math.min(r,49);if(!sh)r=Math.min(r,59);if(!prod)r=Math.min(r,54);if(roleConflict)r=Math.min(r,49);if(A.size<2)r=Math.min(r,69);return Math.max(0,Math.min(99,Math.round(r)))}
function reasons(a,b){let A=new Set(a.tasks),common=b.tasks.filter(x=>A.has(x));return{common,txt:[a.city===b.city?'✓ 勤務地':'△ 勤務地',a.station===b.station?'✓ 最寄駅':'△ 最寄駅',a.shift===b.shift?'✓ 時間帯':'△ 時間帯',a.product===b.product?'✓ 商材':'△ 商材',a.role===b.role||a.role==='mixed'||b.role==='mixed'?'✓ 職種系統':'△ 職種系統',common.length?`✓ 共通作業 ${common.join('・')}`:'△ 共通作業なし'].join(' / ')}}
function dedupe(rows){let m=new Map();for(const x of rows){let key=[x.company,x.city,x.station,x.shift,x.product,[...x.tasks].sort().join('|')].join('::');let old=m.get(key);if(!old||x.w>old.w)m.set(key,x)}return [...m.values()]}
function render(){let t0=performance.now(),a=parse(document.getElementById('input').value),o=document.getElementById('out');if(!a.w){o.innerHTML='<section class="card bad"><div class="empty">基本時給を読み取れませんでした。</div><div class="small">深夜割増後の時給しかない場合は最高額比較をしません。</div></section>';return}let trusted=C.filter(fresh),rated=trusted.map(x=>({...x,rate:rate(a,x),why:reasons(a,x)})),same=dedupe(rated.filter(x=>x.rate>=70)),perCompany=[...new Map(same.sort((x,y)=>y.w-x.w||y.rate-x.rate).map(x=>[x.company,x])).values()].sort((x,y)=>y.w-x.w||y.rate-x.rate),best=perCompany.find(x=>x.w>a.w),dt=Math.round((performance.now()-t0)*10)/10;let head=best?`<section class="card answer"><div class="delta">+${(best.w-a.w).toLocaleString()}円/時</div><div class="price">${a.w.toLocaleString()}円 → ${best.w.toLocaleString()}円</div><div class="meta">${a.company} → ${best.company} ｜ 同じ仕事率 ${best.rate}%<br>${best.why.txt}</div><div class="perf">比較計算 ${dt}ms / 掲載確認スナップショット ${SNAPSHOT_AT}</div></section>`:`<section class="card"><div class="empty">掲載中を確認できた候補では、より高い同じ仕事は見つかっていません</div><div class="perf">比較計算 ${dt}ms / 掲載確認スナップショット ${SNAPSHOT_AT}</div></section>`;let rows=perCompany.map(x=>`<div class="row"><div class="grid"><div><div class="label">会社</div><div class="value">${x.company}</div></div><div><div class="label">基本時給</div><div class="value ${x.w>a.w?'good':''}">${x.w.toLocaleString()}円</div></div><div><div class="label">同じ仕事率</div><div class="value">${x.rate}%</div></div></div><div class="chips"><span class="chip">${x.shift==='night'?'夜勤':'日勤'}</span><span class="chip">${x.station}駅</span><span class="chip">${x.product}</span><span class="chip">${x.emp}</span></div><div class="why">${x.why.txt}</div><div class="link"><a href="${x.url}" target="_blank" rel="noopener" data-job-link="1">実求人を見る</a> ・ 掲載確認 ${x.verifiedAt}</div></div>`).join('');o.innerHTML=head+(rows?`<section class="card"><div class="small">同じ仕事候補 ${perCompany.length}社 / 掲載確認済み ${trusted.length}件</div>${rows}</section>`:'')+`<div class="small" style="margin-top:10px">掲載確認が24時間を超えた候補は自動で比較対象外になります。相場・口コミは初期画面では表示せず、今後の裏側データとして蓄積します。</div>`;document.querySelectorAll('[data-job-link]').forEach(el=>el.addEventListener('click',()=>{sessionStorage.setItem('motto_last_open_clicks','1')}))}
document.getElementById('go').addEventListener('click',render);
</script></body></html>
