<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>もっと高くない？</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#17181a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
main{max-width:1100px;margin:auto;padding:18px 14px 70px}.top{font-weight:900}.hero{text-align:center;padding:24px 0 14px}.hero h1{font-size:clamp(34px,8vw,58px);line-height:1.05;margin:0 0 9px}
.muted{color:#69717c;font-size:13px}.card{background:#fff;border:1px solid #e4e7eb;border-radius:15px;padding:16px;margin-top:14px}
textarea{width:100%;min-height:145px;border:1px solid #cbd1d8;border-radius:11px;padding:13px;font:inherit;line-height:1.55}
button{width:100%;border:0;background:#111827;color:#fff;border-radius:10px;padding:14px;font-weight:900;margin-top:9px;cursor:pointer}
.answer{border:2px solid #a8e2c7;background:#f3fff9}.answer .delta{font-size:34px;font-weight:950;color:#087f5b}.answer .price{font-size:21px;font-weight:900}
.tableWrap{overflow-x:auto;margin-top:10px;border:1px solid #e4e7eb;border-radius:12px}.compare{border-collapse:collapse;width:100%;min-width:1060px;font-size:13px}
.compare th,.compare td{padding:11px 10px;border-bottom:1px solid #e9ebee;text-align:left;white-space:nowrap}.compare th{background:#f8f9fa;font-size:11px;color:#69717c;position:sticky;top:0}
.compare tr:last-child td{border-bottom:0}.money{font-size:18px;font-weight:950}.up{font-weight:900;color:#087f5b}.base{background:#fafafa}.best{background:#f2fff8}.pct{font-weight:900}.work{max-width:290px;white-space:normal!important;line-height:1.35}
.sectionTitle{font-size:18px;font-weight:950;margin:0}.sectionSub{font-size:12px;color:#69717c;margin-top:3px}.source{font-size:11px}.source a{color:#4b5563}.status{font-size:10px;font-weight:800;color:#8a5a00}
.warn{font-size:12px;color:#725300;background:#fff8e8;border:1px solid #f2dda0;border-radius:10px;padding:10px;margin-top:10px}.foot{font-size:11px;color:#7b828b;margin-top:12px;line-height:1.55}
.tag{display:inline-block;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:900;background:#eef2f7;margin-right:4px}.tag.same{background:#def7e8;color:#086b4c}.tag.other{background:#fff1cf;color:#805800}
@media(max-width:600px){main{padding:15px 10px 60px}.hero{padding:22px 0 12px}.card{padding:13px}.answer .delta{font-size:30px}.tableWrap{margin-left:-13px;margin-right:-13px;border-radius:0;border-left:0;border-right:0}
.compare th:first-child,.compare td:first-child{position:sticky;left:0;z-index:2;background:#fff;box-shadow:2px 0 4px #0000000b}.compare th:first-child{background:#f8f9fa}.compare .best td:first-child{background:#f2fff8}.compare .base td:first-child{background:#fafafa}}
</style>
</head>
<body><main>
<div class="top">もっと高くない？</div>
<div class="hero"><h1>その求人、<br>もっと高くない？</h1><div class="muted">求人を貼るだけ。同じ仕事は横1列、作業が違う仕事は別枠で比較します。</div></div>
<section class="card">
<textarea id="t">時給1,750円
東京都大田区 流通センター駅 徒歩5分
20:00～翌5:00
トレカの検品、ラベル照合、データ入力
派遣社員</textarea>
<button id="b">もっと高い求人を探す</button>
<div class="warn">検証版です。基本時給で比較し、深夜割増後の金額は基本時給として扱いません。掲載確認日は求人ごとに表示します。</div>
</section>
<div id="o"></div>
</main>
<script>
const RAW=[
{id:'BR26-0639726',ag:'パーソルフィールドスタッフ',w:1900,city:'大田区',st:'流通センター',wa:3,shift:'night',prod:'トレカ',tasks:['検品','照合','入力'],role:'physical',url:'https://www.tempstaff.co.jp/jbch/job/tokyo/13111/sd-66/BR260639726/',verified:'2026-09-08'},
{id:'FTKB109632',ag:'ランスタッド',w:1750,city:'大田区',st:'流通センター',wa:5,shift:'night',prod:'トレカ',tasks:['検品','照合','入力'],role:'physical',url:'https://www.hatalike.jp/viewjob/8964042c29d81162/',verified:'2026-09-08'},
{id:'TS26-0650466',ag:'パーソルテンプスタッフ',w:1750,city:'大田区',st:'流通センター',wa:1,shift:'day',prod:'トレカ',tasks:['開梱','撮影','検品','梱包'],role:'physical',url:'https://www.tempstaff.co.jp/jbch/job/tokyo/13111/sd-66/TS260650466/',verified:'2026-09-08'},
{id:'TS26-0708244',ag:'パーソルテンプスタッフ',w:1750,city:'大田区',st:'流通センター',wa:4,shift:'day',prod:'トレカ',tasks:['開梱','撮影','検品','封入','梱包','発送','入力'],role:'physical',url:'https://www.tempstaff.co.jp/jbch/job/tokyo/13111/sd-66/TS260708244/',verified:'2026-09-08'},
{id:'TS26-0679313',ag:'パーソルテンプスタッフ',w:1450,city:'大田区',st:'流通センター',wa:1,shift:'day',prod:'トレカ',tasks:['梱包','撮影','入力'],role:'physical',url:'https://www.tempstaff.co.jp/jbch/job/tokyo/13111/sd-66/TS260679313/',verified:'2026-09-08'},
{id:'TS26-0701398',ag:'パーソルテンプスタッフ',w:1950,city:'大田区',st:'流通センター',wa:2,shift:'day',prod:'トレカ',tasks:['問合せ','発送手配','不備確認'],role:'office',url:'https://www.tempstaff.co.jp/jbch/job/tokyo/13111/sd-51/TS260701398/',verified:'2026-09-08'},
{id:'FTKB109469',ag:'ランスタッド',w:1700,city:'大田区',st:'流通センター',wa:5,shift:'day',prod:'トレカ',tasks:['入出荷','仕分け','梱包','検品'],role:'physical',url:'https://www.randstad.co.jp/factory/detail/wnFTKB109469/',verified:'2026-09-08'},
{id:'TS26-0687631',ag:'パーソルテンプスタッフ',w:1700,city:'江東区',st:'潮見',wa:10,shift:'day',prod:'スマホ',tasks:['開梱','検品','仕分け'],role:'physical',url:'https://www.tempstaff.co.jp/jbch/job/tokyo/13108/sd-66/TS260687631/',verified:'2026-09-08'},
{id:'TS26-0676022',ag:'パーソルテンプスタッフ',w:1600,city:'江東区',st:'潮見',wa:10,shift:'day',prod:'スマホ',tasks:['情報確認','入力','スキャン','初期化','発送'],role:'mixed',url:'https://www.tempstaff.co.jp/jbch/job/tokyo/13108/sd-51/TS260676022/',verified:'2026-09-08'},
{id:'TS26-0676018',ag:'パーソルテンプスタッフ',w:1600,city:'江東区',st:'潮見',wa:10,shift:'day',prod:'スマホ',tasks:['返送物確認','入力','梱包','発送'],role:'mixed',url:'https://www.tempstaff.co.jp/jbch/job/tokyo/13108/sd-66/TS260676018/',verified:'2026-09-08'}
];
const aliases={
検品:['検品','チェック','傷チェック','キズ確認','確認作業'],照合:['照合','ラベルとリスト','間違いがないか確認'],入力:['入力','データ入力','pc入力','フォーマットに入力'],
梱包:['梱包','箱詰め','段ボールにつめる'],発送:['発送','出荷','送付準備','配送手配'],開梱:['開梱','開封','箱を開け'],撮影:['撮影'],仕分け:['仕分け'],封入:['封入','ケースへ'],入出荷:['入出荷'],
情報確認:['情報チェック','情報確認'],スキャン:['スキャン','バーコード'],初期化:['初期化'],返送物確認:['返送物のチェック'],問合せ:['問い合わせ','お問い合わせ対応'],発送手配:['発送手配'],不備確認:['不備連絡','不備確認','申込書の不備']
};
function dedupKey(j){return [j.ag,j.city,j.st,j.shift,j.prod,j.role,[...j.tasks].sort().join('|'),j.w].join('::')}
const J=[...new Map(RAW.map(j=>[dedupKey(j),j])).values()];
function norm(s){return s.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/，/g,',').toLowerCase()}
function parse(s){
 s=norm(s);
 let m=s.replace(/,/g,'').match(/(?:基本時給|通常時給|時給)\s*[:：]?\s*(\d{3,4})/),
 st=(s.match(/([一-龠ぁ-んァ-ヶー]+)駅/)||[])[1]||'',
 city=((s.match(/[一-龠ぁ-んァ-ヶー]+(?:市|区)/g)||[]).pop()||'').replace(/^東京都/,''),
 wa=+(s.match(/徒歩\s*(\d+)\s*分/)||[])[1]||0,
 shift=/20:00|21:00|22:00|夜勤|翌/.test(s)?'night':'day',
 prod=s.includes('トレカ')||s.includes('トレーディングカード')?'トレカ':s.includes('スマホ')||s.includes('携帯')?'スマホ':'',
 tasks=[];
 for(const [k,vs] of Object.entries(aliases))if(vs.some(v=>s.includes(v)))tasks.push(k);
 let officeHits=['問合せ','発送手配','不備確認'].filter(x=>tasks.includes(x)).length;
 let physicalHits=['検品','梱包','開梱','撮影','仕分け','封入','入出荷','照合'].filter(x=>tasks.includes(x)).length;
 let role=officeHits>=2&&physicalHits===0?'office':physicalHits>=2&&officeHits===0?'physical':'mixed';
 return{w:m?+m[1]:null,st,city,wa,shift,prod,tasks,role}
}
function taskScore(a,b){
 if(!a.length||!b.length)return{f1:0,mincov:0,inter:0};
 let A=new Set(a),B=new Set(b),inter=[...A].filter(x=>B.has(x)).length,c1=inter/A.size,c2=inter/B.size;
 return{f1:2*inter/(A.size+B.size),mincov:Math.min(c1,c2),inter}
}
function classify(i,j){
 let ts=taskScore(i.tasks,j.tasks),site=i.city===j.city&&i.st===j.st,shift=i.shift===j.shift,prod=!!i.prod&&i.prod===j.prod,
 walk=i.wa&&j.wa?Math.max(0,1-Math.abs(i.wa-j.wa)/10):.5,roleConflict=(i.role==='office'&&j.role==='physical')||(i.role==='physical'&&j.role==='office');
 let raw=(site?29:0)+(shift?18:0)+(prod?15:0)+ts.f1*34+walk*4+(i.role===j.role?3:0),rate=Math.min(99,Math.round(raw));
 if(!site)rate=Math.min(rate,39);if(!shift)rate=Math.min(rate,59);if(!prod)rate=Math.min(rate,49);if(roleConflict)rate=Math.min(rate,54);if(i.tasks.length<2)rate=Math.min(rate,69);
 let exact=site&&shift&&prod&&!roleConflict&&i.tasks.length>=2&&j.tasks.length>=2&&ts.inter>=2&&ts.f1>=.72&&ts.mincov>=.60;
 return{...j,rate,exact,ts,roleConflict}
}
function tr(x,i,cls=''){
 let d=x.w-i.w;
 return `<tr class="${cls}"><td><b>${x.ag}</b><div class="source"><a href="${x.url}" target="_blank" rel="noopener">${x.id}</a> <span class="status">確認 ${x.verified}</span></div></td><td class="money">${x.w.toLocaleString()}円</td><td class="${d>0?'up':''}">${d===0?'基準':(d>0?'+':'')+d.toLocaleString()+'円'}</td><td class="pct">${x.rate!=null?x.rate+'%':'—'}</td><td class="work">${x.tasks.join('・')}</td><td>${x.shift==='night'?'夜勤':'日勤'}</td><td>${x.st} 徒歩${x.wa}分</td></tr>`
}
function table(rows,i,base){
 let h=`<div class="tableWrap"><table class="compare"><thead><tr><th>会社</th><th>基本時給</th><th>差額</th><th>同じ仕事率</th><th>作業内容</th><th>時間帯</th><th>勤務地</th></tr></thead><tbody>`;
 if(base)h+=`<tr class="base"><td><b>あなたの求人</b><div class="source">基準</div></td><td class="money">${i.w.toLocaleString()}円</td><td>基準</td><td>—</td><td class="work">${i.tasks.join('・')}</td><td>${i.shift==='night'?'夜勤':'日勤'}</td><td>${i.st} 徒歩${i.wa||'—'}分</td></tr>`;
 rows.forEach((x,n)=>h+=tr(x,i,n===0&&x.w>i.w?'best':''));
 return h+'</tbody></table></div>'
}
function run(){
 let i=parse(document.getElementById('t').value),o=document.getElementById('o');
 if(!i.w||!i.city||!i.st){o.innerHTML='<section class="card"><b>時給・市区・駅を読み取れませんでした。</b><div class="muted">求人本文をもう少し長く貼ってください。</div></section>';return}
 let all=J.map(j=>classify(i,j));
 let same=all.filter(x=>x.exact).sort((a,b)=>b.w-a.w||b.rate-a.rate);
 let other=all.filter(x=>!x.exact&&x.city===i.city&&x.st===i.st&&x.shift===i.shift).sort((a,b)=>b.w-a.w||b.rate-a.rate);
 let best=same.find(x=>x.w>i.w);
 let h=`<section class="card answer"><div class="muted">結論</div>${best?`<div class="delta">+${(best.w-i.w).toLocaleString()}円/時</div><div class="price">同じ仕事で最高 ${best.w.toLocaleString()}円</div><div class="muted">同じ仕事率 ${best.rate}%　${best.ag}</div>`:`<div class="price">同じ仕事でもっと高い求人は未確認</div>`}</section>`;
 h+=`<section class="card"><div class="sectionTitle"><span class="tag same">同じ仕事</span>一目で比較</div><div class="sectionSub">勤務地・勤務帯・商品一致に加え、工程2項目以上一致＋工程F1 72%以上。事務中心と現場作業は同じ仕事にしません。</div>${table(same,i,true)}</section>`;
 if(other.length)h+=`<section class="card"><div class="sectionTitle"><span class="tag other">別仕事</span>似ている別の仕事</div><div class="sectionSub">同じ現場・時間帯でも作業内容が違う求人。最高時給判定には含めません。</div>${table(other,i,false)}</section>`;
 h+=`<div class="foot">比較軸は基本時給。深夜割増後の上限額は基本時給にしません。同じ仕事率は0〜99%で、100%は表示しません。重複は会社・現場・勤務帯・商品・役割・工程・基本時給で除去しています。</div>`;
 o.innerHTML=h
}
document.getElementById('b').onclick=run;run();
</script></body></html>
