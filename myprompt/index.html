<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyPrompt Lite</title><style>
body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;margin:0;background:#f6f7fb;color:#111827}main{max-width:760px;margin:auto;padding:16px 16px 90px}h1{font-size:22px;margin:4px 0 12px}.top{position:sticky;top:0;background:#f6f7fb;padding:8px 0 12px}.row{display:flex;gap:8px}.row>*{flex:1}input,textarea,button{font:inherit}input,textarea{width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:12px;padding:12px;background:#fff}textarea{min-height:180px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin:10px 0}.name{font-weight:800}.cat{font-size:12px;color:#6b7280;margin:3px 0 8px}.text{white-space:pre-wrap;line-height:1.55;color:#374151;max-height:7.5em;overflow:hidden}.actions{display:flex;gap:8px;margin-top:12px}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:#111827;color:#fff}.ghost{background:#fff;color:#111827;border:1px solid #d1d5db}.fab{position:fixed;right:20px;bottom:22px;width:58px;height:58px;border-radius:50%;font-size:28px}.sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end}.sheet.on{display:flex}.panel{background:#fff;width:100%;padding:18px;border-radius:22px 22px 0 0;max-height:88vh;overflow:auto}.small{font-size:12px;color:#6b7280}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:999px;display:none}.toast.on{display:block}
</style></head><body><main><div class="top"><h1>MyPrompt Lite</h1><input id="q" placeholder="プロンプトを検索…"><div class="small" id="count"></div></div><div id="list"></div></main><button class="fab" id="add">＋</button><div class="sheet" id="sheet"><div class="panel"><h2 id="ttl">追加</h2><div class="row"><input id="name" placeholder="名前"><input id="cat" placeholder="カテゴリ"></div><p><textarea id="txt" placeholder="プロンプト本文"></textarea></p><div class="actions"><button class="ghost" id="close">閉じる</button><button id="save">保存</button></div><p><button class="ghost" id="del" style="display:none;width:100%">削除</button></p></div></div><div class="toast" id="toast">コピーしました</div><script>
const K='myprompt-lite-v2';const seed=[
{name:'次（強化）',cat:'進行',txt:'直前までの目的・確定条件・進行単位を維持したまま、処理済みを繰り返さず、未処理の次の項目を1つ進めてください。すでに回答済みのことは聞き直さないでください。'},
{name:'徹底調査',cat:'調査',txt:'このテーマを徹底的に調べてください。重要な事実は最新情報と一次情報を優先して確認し、推測と確認済み事実を区別してください。主要な反例・制約・既存サービスも確認し、結論だけでなく判断根拠も示してください。'},
{name:'いこう',cat:'実行',txt:'ここまでの会話で確定した目的・条件・修正点・禁止事項を整理し、勝手に追加変更せず、その内容で実行に進んでください。未確定事項は必要最小限だけ扱ってください。'}].map((x,i)=>({...x,id:crypto.randomUUID(),created:Date.now()-i}));
let a;try{a=JSON.parse(localStorage.getItem(K))||seed}catch{a=seed}let edit=null;
const $=x=>document.getElementById(x),esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));function persist(){localStorage.setItem(K,JSON.stringify(a))}
function toast(){const t=$('toast');t.classList.add('on');setTimeout(()=>t.classList.remove('on'),900)}
async function cp(t){try{await navigator.clipboard.writeText(t)}catch{const e=document.createElement('textarea');e.value=t;document.body.appendChild(e);e.select();document.execCommand('copy');e.remove()}toast()}
function render(){const q=$('q').value.toLowerCase();const x=a.filter(v=>(v.name+' '+v.cat+' '+v.txt).toLowerCase().includes(q));$('count').textContent=x.length+'件表示 / '+a.length+'件保存';$('list').innerHTML=x.map(v=>'<div class="card"><div class="name">'+esc(v.name)+'</div><div class="cat">'+esc(v.cat||'未分類')+'</div><div class="text">'+esc(v.txt)+'</div><div class="actions"><button data-c="'+v.id+'">コピー</button><button class="ghost" data-e="'+v.id+'">編集</button></div></div>').join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>cp(a.find(v=>v.id===b.dataset.c).txt));document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>open(a.find(v=>v.id===b.dataset.e)))}
function open(v){edit=v?.id||null;$('ttl').textContent=v?'編集':'追加';$('name').value=v?.name||'';$('cat').value=v?.cat||'';$('txt').value=v?.txt||'';$('del').style.display=v?'block':'none';$('sheet').classList.add('on')}
function close(){$('sheet').classList.remove('on');edit=null}$('add').onclick=()=>open();$('close').onclick=close;$('q').oninput=render;$('save').onclick=()=>{const n=$('name').value.trim(),c=$('cat').value.trim()||'未分類',t=$('txt').value.trim();if(!n||!t)return;if(edit){Object.assign(a.find(v=>v.id===edit),{name:n,cat:c,txt:t})}else a.unshift({id:crypto.randomUUID(),name:n,cat:c,txt:t,created:Date.now()});persist();close();render()};$('del').onclick=()=>{if(edit&&confirm('削除しますか？')){a=a.filter(v=>v.id!==edit);persist();close();render()}};persist();render();
</script></body></html>
