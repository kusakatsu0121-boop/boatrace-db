<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>暇になると余計なことを考える</title>
<style>
:root{
  --ink:#192330;
  --accent:#eb5055;
  --bg:#f7f9fc;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  overflow:hidden;
}
.stage{
  position:relative;
  width:min(100vw,540px);
  height:100dvh;
  min-height:620px;
  margin:auto;
  background:var(--bg);
  overflow:hidden;
}
.scene{
  position:absolute;
  inset:0;
  opacity:0;
}
.textbox{
  position:absolute;
  top:calc(env(safe-area-inset-top) + 7vh);
  left:7vw;
  right:7vw;
  max-width:460px;
  margin:auto;
  text-align:center;
  z-index:5;
}
.kicker{
  margin:0 0 8px;
  font-size:clamp(18px,5vw,27px);
  line-height:1.45;
  font-weight:700;
  color:var(--ink);
  letter-spacing:.02em;
}
.main{
  margin:0;
  font-size:clamp(30px,8.2vw,44px);
  line-height:1.22;
  font-weight:850;
  color:var(--ink);
  letter-spacing:.01em;
  text-wrap:balance;
}
.red{color:var(--accent)}
.visual{
  position:absolute;
  left:0;
  right:0;
  top:34%;
  bottom:8%;
}
.man{
  position:absolute;
  left:50%;
  top:42%;
  width:150px;
  height:230px;
  transform:translate(-50%,-50%);
  animation:fidget .55s ease-in-out infinite alternate;
}
.head{position:absolute;left:52px;top:0;width:46px;height:46px;border:7px solid var(--ink);border-radius:50%}
.body{position:absolute;left:72px;top:52px;width:8px;height:88px;background:var(--ink);border-radius:8px}
.arm,.leg{position:absolute;width:8px;height:64px;background:var(--ink);transform-origin:top center;border-radius:8px}
.a1{left:72px;top:68px;transform:rotate(52deg)}.a2{left:72px;top:68px;transform:rotate(-52deg)}
.l1{left:72px;top:134px;transform:rotate(32deg)}.l2{left:72px;top:134px;transform:rotate(-32deg)}
.clock{
  position:absolute;
  right:7%;
  top:8%;
  width:96px;height:96px;
  border:6px solid var(--ink);
  border-radius:50%;
  background:white;
}
.clock:before{
  content:"";
  position:absolute;
  width:6px;height:31px;
  left:42px;top:16px;
  background:var(--ink);
  transform-origin:bottom center;
}
.hand{
  position:absolute;
  width:5px;height:35px;
  background:var(--accent);
  left:43px;top:13px;
  transform-origin:bottom center;
  animation:hand 3s linear infinite;
}
.phone{
  position:absolute;
  right:8%;
  top:37%;
  width:82px;height:148px;
  border-radius:15px;
  background:#263040;
  box-shadow:0 10px 28px #19233020;
}
.phone:after{content:"";position:absolute;inset:13px 10px 22px;background:#dff2ff;border-radius:9px}
.thoughts{
  position:absolute;
  left:50%;
  top:18%;
  width:250px;
  height:190px;
  transform:translateX(-50%);
}
.dot{
  position:absolute;
  width:14px;height:14px;
  background:var(--accent);
  border-radius:50%;
  left:118px;top:30px;
  transform-origin:7px 78px;
  animation:pulse 1.2s ease-in-out infinite alternate;
}
.caption{
  position:absolute;
  left:8%;
  right:8%;
  bottom:9%;
  text-align:center;
  font-size:clamp(15px,4.1vw,21px);
  line-height:1.6;
  font-weight:650;
  color:#607080;
}
.s1{animation:s1 10s infinite}.s2{animation:s2 10s infinite}.s3{animation:s3 10s infinite}
@keyframes s1{0%,29%{opacity:1}30%,100%{opacity:0}}
@keyframes s2{0%,29%{opacity:0}30%,59%{opacity:1}60%,100%{opacity:0}}
@keyframes s3{0%,59%{opacity:0}60%,100%{opacity:1}}
@keyframes fidget{to{transform:translate(-46%,-50%) rotate(1.4deg)}}
@keyframes hand{to{transform:rotate(16deg)}}
@keyframes pulse{to{scale:1.35;opacity:.6}}
.progress{
  position:absolute;
  left:0;bottom:0;
  height:6px;
  background:var(--accent);
  animation:prog 10s linear infinite;
}
@keyframes prog{from{width:0}to{width:100%}}
</style>
</head>
<body>
<div class="stage">
  <section class="scene s1">
    <div class="textbox"><p class="main">暇だ……</p></div>
    <div class="visual">
      <div class="man"><div class="head"></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div></div>
      <div class="clock"><div class="hand"></div></div>
    </div>
  </section>
  <section class="scene s2">
    <div class="textbox"><p class="kicker">何もしないだけなのに</p><p class="main red">なぜ苦痛？</p></div>
    <div class="visual">
      <div class="man"><div class="head"></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div></div>
      <div class="phone"></div>
    </div>
  </section>
  <section class="scene s3">
    <div class="textbox"><p class="kicker">暇になると</p><p class="main red">余計なことを考える</p></div>
    <div class="visual">
      <div class="thoughts">
        <div class="dot" style="transform:rotate(0deg)"></div><div class="dot" style="transform:rotate(52deg)"></div>
        <div class="dot" style="transform:rotate(104deg)"></div><div class="dot" style="transform:rotate(156deg)"></div>
        <div class="dot" style="transform:rotate(208deg)"></div><div class="dot" style="transform:rotate(260deg)"></div>
        <div class="dot" style="transform:rotate(312deg)"></div>
      </div>
      <div class="man"><div class="head"></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div></div>
      <div class="caption">何もしていない時間ほど、<br>頭の中だけ忙しくなることがある。</div>
    </div>
  </section>
  <div class="progress"></div>
</div>
</body>
</html>
