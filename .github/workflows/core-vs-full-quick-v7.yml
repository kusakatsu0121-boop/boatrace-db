name: Core vs full quick v7

on:
  push:
    paths:
      - 'core_quick_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
          fetch-depth: 1
      - run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn
      - run: python core_vs_full_quick_v7.py
      - uses: actions/upload-artifact@v4
        with:
          name: core-vs-full-quick-v7
          path: artifacts/core_vs_full_quick_v7/*.csv
          retention-days: 30
