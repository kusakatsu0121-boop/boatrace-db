name: Inspect retirement warning and layout
on:
  push:
    branches: [fix/taishoku-readability-round2-20261014]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash taishoku_app/build.sh
      - name: Inspect target blocks
        run: |
          R=taishoku_app/runtime/report_template_v0.1/render_report.py
          E=taishoku_app/runtime/workflow_rule_package_v0.1/evaluate.mjs
          T=taishoku_app/runtime/report_template_v0.1/report_template.html
          echo '=== critical_warning ==='
          grep -n -A35 '^def critical_warning' "$R"
          echo '=== ACT-POST-VC ==='
          grep -n -B8 -A8 "ACT-POST-VC" "$E"
          echo '=== benefit order ==='
          grep -n -B4 -A32 "失業手当（基本手当）" "$T"
