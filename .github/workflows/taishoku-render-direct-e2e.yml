name: taishoku-render-direct-e2e

on:
  push:
    branches:
      - taishoku-e2e-test-20260912

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run exact bundle end to end
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rt /tmp/q /tmp/jobs
          mkdir -p /tmp/rt /tmp/q /tmp/jobs
          cat taishoku_app/bundle/part*.txt | base64 -d > /tmp/app.zip
          unzip -q /tmp/app.zip -d /tmp/rt
          python3 -m pip install --quiet pymupdf==1.26.3
          export PORT=3113 HOST=127.0.0.1 TALLY_FORM_ID=QKyVpY ALLOW_UNSIGNED_WEBHOOKS=true
          export WORKFLOW_QUEUE_ROOT=/tmp/q WORKFLOW_OUTPUT_ROOT=/tmp/jobs WORKFLOW_PYTHON="$(command -v python3)"
          node /tmp/rt/workflow_webhook_v0.1/webhook_server.mjs >/tmp/server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:3113/health >/tmp/health.json 2>/dev/null && break; sleep 1; done
          CODE=$(curl -sS -o /tmp/body.json -w '%{http_code}' -H 'content-type: application/json' --data-binary @taishoku_app/e2e_payload_20260912.json http://127.0.0.1:3113/webhooks/tally)
          echo "HEALTH=$(cat /tmp/health.json)"
          echo "WEBHOOK_HTTP=$CODE BODY=$(cat /tmp/body.json)"
          test "$CODE" = "202"
          for i in {1..30}; do
            M=$(find /tmp/jobs -name job_manifest.json | head -1 || true)
            [ -n "$M" ] && break
            sleep 1
          done
          sleep 3
          M=$(find /tmp/jobs -name job_manifest.json | head -1)
          N=$(find /tmp/jobs -name normalized_answer.json | head -1)
          E=$(find /tmp/jobs -name evaluation.json | head -1)
          H=$(find /tmp/jobs -name report_preview.html | head -1)
          P=$(find /tmp/jobs -name report_preview.pdf | head -1)
          python3 - "$M" "$N" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1],encoding='utf-8'))
          n=json.load(open(sys.argv[2],encoding='utf-8'))
          print('MANIFEST',json.dumps({k:m.get(k) for k in ['status','delivery_allowed','automatic_delivery','reference_id']},ensure_ascii=False))
          print('NORMALIZED',json.dumps({k:n.get(k) for k in ['display_name','wage_6m_total','service_scope_consent','adapter_warnings','reference_id']},ensure_ascii=False))
          assert m.get('status') == 'ready_for_manual_delivery'
          assert m.get('delivery_allowed') is True
          assert m.get('automatic_delivery') is False
          assert n.get('wage_6m_total') == 1800000
          assert n.get('service_scope_consent') == ['confirmed']
          assert n.get('adapter_warnings') == []
          PY
          test -s "$E"
          test -s "$H"
          test -s "$P"
          echo "EVALUATION=$E"
          echo "HTML=$H bytes=$(stat -c %s "$H")"
          echo "PDF=$P bytes=$(stat -c %s "$P")"
