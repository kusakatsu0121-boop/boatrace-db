name: Market tail calibration leak-safe v5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout model code
        uses: actions/checkout@v4
      - name: Checkout public boat-race data
        uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
          fetch-depth: 1
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn
      - name: Run V5 tail calibration
        shell: bash
        run: |
          set -o pipefail
          python market_tail_calibration_v5.py | tee /tmp/market-v5.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: market-tail-v5
          path: artifacts/market_tail_v5/*.csv
          retention-days: 30
      - name: Publish result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/result.md
          import pandas as pd
          for name in ['meta','model_metrics','sensitivity','robustness','primary_odds_bands','july_strategy_diagnostics']:
              p=f'artifacts/market_tail_v5/{name}.csv'
              print(f'\n## {name}')
              print('```')
              print(pd.read_csv(p).to_string(index=False))
              print('```')
          PY
          gh issue create --title "Leak-safe V5 tail calibration ${GITHUB_RUN_ID}" --body-file /tmp/result.md
