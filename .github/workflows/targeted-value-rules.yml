name: Targeted value rules
on:
  push:
    paths:
      - 'targeted_value_rules.py'
      - '.github/workflows/targeted-value-rules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
          fetch-depth: 1
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - run: python targeted_value_rules.py
      - uses: actions/upload-artifact@v4
        with:
          name: targeted-value-rules
          path: artifacts/targeted_value_rules/
