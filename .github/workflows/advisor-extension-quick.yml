name: Boat Advisor extension QUICK scan

on:
  workflow_dispatch:
  push:
    paths:
      - 'advisor_extension_quick.py'
      - 'advisor_extension_quick_trigger*.txt'

permissions:
  contents: read

jobs:
  quick-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - run: python advisor_extension_quick.py
      - uses: actions/upload-artifact@v4
        with:
          name: advisor-extension-quick
          path: artifacts/advisor_extension_patterns
