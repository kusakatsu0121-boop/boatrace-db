name: Deploy Racer Directory
on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "build_racer_site.py"
      - "racer_directory.py"
      - "enrich_adjustment_memos.py"
      - "enrich_same_day.py"
      - "enrich_bad_early_recovery.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "25 20 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: racer-directory-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Build racer directory data
        run: |
          python build_racer_site.py
          python enrich_adjustment_memos.py
          python enrich_same_day.py
          python enrich_bad_early_recovery.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
