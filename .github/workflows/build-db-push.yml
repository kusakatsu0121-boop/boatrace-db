name: Build boat race database on push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  SOURCE_REPO: BoatraceCSV/boatracecsv.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout collector
        uses: actions/checkout@v4

      - name: Checkout public boat-race data
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          path: source
          fetch-depth: 1

      - name: Inspect available data
        id: inspect
        run: |
          CSV_COUNT=$(find source/data -type f -name '*.csv' | wc -l)
          echo "csv_count=$CSV_COUNT" >> "$GITHUB_OUTPUT"

      - name: Build SQLite from all available result CSVs
        id: build
        run: |
          python collector.py source/data/results artifacts/boatrace.sqlite || python collector.py source/data artifacts/boatrace.sqlite
          RACES=$(sqlite3 artifacts/boatrace.sqlite 'select count(*) from races;')
          ENTRIES=$(sqlite3 artifacts/boatrace.sqlite 'select count(*) from entries;')
          METHODS=$(sqlite3 -separator ' / ' artifacts/boatrace.sqlite "select winning_method,count(*) from races group by winning_method order by count(*) desc;")
          echo "races=$RACES" >> "$GITHUB_OUTPUT"
          echo "entries=$ENTRIES" >> "$GITHUB_OUTPUT"
          echo "methods<<EOF" >> "$GITHUB_OUTPUT"
          echo "$METHODS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Install racer-directory dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Build racer directory
        id: racers
        run: |
          python racer_directory.py --source source/data --out artifacts/racer_directory --sqlite artifacts/boatrace.sqlite
          RACERS=$(python - <<'PY'
          import pandas as pd
          print(len(pd.read_csv('artifacts/racer_directory/racer_basic.csv')))
          PY
          )
          echo "racers=$RACERS" >> "$GITHUB_OUTPUT"
          ls -lh artifacts/racer_directory

      - name: Build adjusted ratings and forward validation
        run: |
          python build_adjusted_winrate.py --source source/data --out artifacts/racer_directory
          python validate_adjusted_winrate.py --source source/data --out artifacts/racer_directory --holdout-days 30
          echo "=== forward validation ==="
          cat artifacts/racer_directory/model_forward_validation.csv
          echo "=== validation period ==="
          cat artifacts/racer_directory/model_forward_validation_meta.csv

      - name: Upload database and racer directory
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-database
          path: |
            artifacts/boatrace.sqlite
            artifacts/racer_directory/*.csv
          retention-days: 30

      - name: Publish build summary as issue
        env:
          GH_TOKEN: ${{ github.token }}
          CSV_COUNT: ${{ steps.inspect.outputs.csv_count }}
          RACES: ${{ steps.build.outputs.races }}
          ENTRIES: ${{ steps.build.outputs.entries }}
          RACERS: ${{ steps.racers.outputs.racers }}
          METHODS: ${{ steps.build.outputs.methods }}
        run: |
          cat > /tmp/body.md <<EOF
          Automated boat-race database build completed.

          - Source CSV files found: ${CSV_COUNT}
          - Unique races in SQLite: ${RACES}
          - Boat entry records: ${ENTRIES}
          - Racer directory entries: ${RACERS}

          Racer directory tables, adjusted win-rate-equivalent ratings, and forward validation files are included in the workflow artifact and SQLite.

          Winning methods:
          \`\`\`
          ${METHODS}
          \`\`\`

          Commit: ${GITHUB_SHA}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue create --title "DB build result ${GITHUB_RUN_ID}" --body-file /tmp/body.md
