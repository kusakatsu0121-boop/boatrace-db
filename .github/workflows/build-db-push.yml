name: Build boat race database on push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: BoatraceCSV/boatracecsv.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout collector
        uses: actions/checkout@v4

      - name: Checkout public boat-race data
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          path: source
          fetch-depth: 1

      - name: Inspect available data
        run: |
          echo "CSV files:"
          find source/data -type f -name '*.csv' | wc -l || true

      - name: Build SQLite from all available result CSVs
        run: |
          python collector.py source/data/results artifacts/boatrace.sqlite || python collector.py source/data artifacts/boatrace.sqlite
          sqlite3 artifacts/boatrace.sqlite 'select count(*) as races from races; select count(*) as entries from entries;'

      - name: Upload SQLite
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-database
          path: artifacts/boatrace.sqlite
          retention-days: 30
