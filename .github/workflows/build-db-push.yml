name: Build boat race database on push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  SOURCE_REPO: BoatraceCSV/boatracecsv.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout collector
        uses: actions/checkout@v4

      - name: Checkout public boat-race data
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          path: source
          fetch-depth: 1

      - name: Inspect available data
        id: inspect
        run: |
          CSV_COUNT=$(find source/data -type f -name '*.csv' | wc -l)
          echo "csv_count=$CSV_COUNT" >> "$GITHUB_OUTPUT"

      - name: Build SQLite from all available result CSVs
        id: build
        run: |
          python collector.py source/data/results artifacts/boatrace.sqlite || python collector.py source/data artifacts/boatrace.sqlite
          RACES=$(sqlite3 artifacts/boatrace.sqlite 'select count(*) from races;')
          ENTRIES=$(sqlite3 artifacts/boatrace.sqlite 'select count(*) from entries;')
          METHODS=$(sqlite3 -separator ' / ' artifacts/boatrace.sqlite "select winning_method,count(*) from races group by winning_method order by count(*) desc;")
          echo "races=$RACES" >> "$GITHUB_OUTPUT"
          echo "entries=$ENTRIES" >> "$GITHUB_OUTPUT"
          echo "methods<<EOF" >> "$GITHUB_OUTPUT"
          echo "$METHODS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Build racer directory
        id: racers
        run: |
          python racer_directory.py --source source/data --out artifacts/racer_directory --sqlite artifacts/boatrace.sqlite
          RACERS=$(python - <<'PY'
          import pandas as pd
          print(len(pd.read_csv('artifacts/racer_directory/racer_basic.csv')))
          PY
          )
          echo "racers=$RACERS" >> "$GITHUB_OUTPUT"
          ls -lh artifacts/racer_directory

      - name: Build exploratory course/style strategy features
        id: strategy
        run: |
          python strategy_features.py --source source/data --out artifacts/strategy_features --holdout-days 120 | tee /tmp/strategy.log
          SIGNALS=$(python - <<'PY'
          import pandas as pd
          p='artifacts/strategy_features/top_strategy_signals.csv'
          try: print(len(pd.read_csv(p)))
          except Exception: print(0)
          PY
          )
          echo "signals=$SIGNALS" >> "$GITHUB_OUTPUT"

      - name: Build strict reproducible interaction features
        id: strict
        run: |
          python strategy_strict.py --source source/data --out artifacts/strategy_strict --holdout-days 120 | tee /tmp/strict.log
          STRICT_SIGNALS=$(python - <<'PY'
          import pandas as pd
          try: print(len(pd.read_csv('artifacts/strategy_strict/top_strategy_signals.csv')))
          except Exception: print(0)
          PY
          )
          PATH_SIGNALS=$(python - <<'PY'
          import pandas as pd
          try: print(len(pd.read_csv('artifacts/strategy_strict/top_path_signals.csv')))
          except Exception: print(0)
          PY
          )
          echo "strict_signals=$STRICT_SIGNALS" >> "$GITHUB_OUTPUT"
          echo "path_signals=$PATH_SIGNALS" >> "$GITHUB_OUTPUT"
          ls -lh artifacts/strategy_strict

      - name: Run leakage-safe EV and bankroll backtest
        id: evtest
        run: |
          python backtest_ev.py --source source/data --out artifacts/backtest_ev | tee /tmp/evtest.log
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pandas as pd
          p='artifacts/backtest_ev/summary.csv'
          s=pd.read_csv(p)
          r=s[(s['fold']=='POOLED') & (s['strategy']=='EV1.15_TOP1')].iloc[0]
          print(f"primary_bets={int(r['bets'])}")
          print(f"primary_hits={int(r['hits'])}")
          print(f"primary_roi={r['roi_pct']:.2f}")
          PY
          ls -lh artifacts/backtest_ev

      - name: Upload database, racer directory and strategy features
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-database
          path: |
            artifacts/boatrace.sqlite
            artifacts/racer_directory/*.csv
            artifacts/strategy_features/*.csv
            artifacts/strategy_strict/*.csv
            artifacts/backtest_ev/*.csv
          retention-days: 30

      - name: Publish build summary as issue
        env:
          GH_TOKEN: ${{ github.token }}
          CSV_COUNT: ${{ steps.inspect.outputs.csv_count }}
          RACES: ${{ steps.build.outputs.races }}
          ENTRIES: ${{ steps.build.outputs.entries }}
          RACERS: ${{ steps.racers.outputs.racers }}
          SIGNALS: ${{ steps.strategy.outputs.signals }}
          STRICT_SIGNALS: ${{ steps.strict.outputs.strict_signals }}
          PATH_SIGNALS: ${{ steps.strict.outputs.path_signals }}
          PRIMARY_BETS: ${{ steps.evtest.outputs.primary_bets }}
          PRIMARY_HITS: ${{ steps.evtest.outputs.primary_hits }}
          PRIMARY_ROI: ${{ steps.evtest.outputs.primary_roi }}
          METHODS: ${{ steps.build.outputs.methods }}
        run: |
          cat > /tmp/body.md <<EOF
          Automated boat-race database build completed.

          - Source CSV files found: ${CSV_COUNT}
          - Unique races in SQLite: ${RACES}
          - Boat entry records: ${ENTRIES}
          - Racer directory entries: ${RACERS}
          - Exploratory holdout signals: ${SIGNALS}
          - Strict reproducible pair signals: ${STRICT_SIGNALS}
          - Strict reproducible trifecta-path signals: ${PATH_SIGNALS}
          - Primary OOS EV>=1.15 / top1 bets: ${PRIMARY_BETS}
          - Primary OOS hits: ${PRIMARY_HITS}
          - Primary OOS fixed-100 return rate: ${PRIMARY_ROI}%

          Backtest uses only pre-race information: racer/course types learned from prior races,
          start-exhibition course placement, and the od3 trifecta odds snapshot around 10 minutes before deadline.
          Signals are discovered in a prior 60-day window and evaluated only in the following untouched 60-day window.

          Winning methods:
          \`\`\`
          ${METHODS}
          \`\`\`

          Commit: ${GITHUB_SHA}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue create --title "DB build result ${GITHUB_RUN_ID}" --body-file /tmp/body.md
