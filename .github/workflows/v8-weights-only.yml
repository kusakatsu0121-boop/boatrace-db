name: V8 interpretable weights only

on:
  workflow_dispatch:
  push:
    paths:
      - 'v8_weights_trigger*.txt'

permissions:
  contents: read

jobs:
  weights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
      - run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn
      - run: python v8_weights_only.py
      - uses: actions/upload-artifact@v4
        with:
          name: v8-weights-only
          path: artifacts/v8_weights_only
