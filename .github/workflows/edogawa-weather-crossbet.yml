name: Edogawa weather cross-bet scan
on:
  workflow_dispatch:
  push:
    paths:
      - "edogawa_weather_crossbet.py"
      - ".github/workflows/edogawa-weather-crossbet.yml"
permissions:
  contents: read
  issues: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - run: python edogawa_weather_crossbet.py | tee /tmp/crossbet.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edogawa-weather-crossbet
          path: artifacts/edogawa_weather_crossbet
          retention-days: 30
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          p=Path('artifacts/edogawa_weather_crossbet')
          body=['Edogawa weather cross-bet result','']
          try:
              s=pd.read_csv(p/'summary.csv').iloc[0]
              body += [f"- races: {int(s['edogawa_races'])}",f"- date: {s['date_min']} .. {s['date_max']}",f"- stable candidates: {int(s['stable_candidates'])}",'']
              t=pd.read_csv(p/'stable_top500.csv').head(20)
              body += ['## Stable top', t.to_string(index=False) if len(t) else 'none']
          except Exception as e:
              body += ['failed',str(e)]
              if Path('/tmp/crossbet.log').exists():
                  body += ['','## log','\n'.join(Path('/tmp/crossbet.log').read_text(errors='ignore').splitlines()[-100:])]
          Path('/tmp/issue.md').write_text('\n'.join(body))
          PY
          gh issue create --title "Edogawa weather cross-bet ${GITHUB_RUN_ID}" --body-file /tmp/issue.md
