name: Hierarchical causal EV backtest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout model code
        uses: actions/checkout@v4
      - name: Checkout public boat-race data
        uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
          fetch-depth: 1
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run hierarchical OOS backtest
        shell: bash
        run: |
          set -o pipefail
          python backtest_hierarchical.py | tee /tmp/backtest.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: hierarchical-backtest
          path: artifacts/backtest_hierarchical/*.csv
          retention-days: 30
      - name: Publish result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/result.md
          import pandas as pd
          s=pd.read_csv('artifacts/backtest_hierarchical/summary.csv')
          m=pd.read_csv('artifacts/backtest_hierarchical/meta.csv')
          print('Hierarchical May-Jun discovery -> July-Aug OOS backtest completed.')
          print('')
          print('Primary: EV >= 1.15, max 1 bet/race, fixed 100 yen.')
          print('```')
          print(s.to_string(index=False))
          print('```')
          print('')
          print('Meta / Kelly:')
          print('```')
          print(m.to_string(index=False))
          print('```')
          PY
          gh issue create --title "Hierarchical EV backtest result ${GITHUB_RUN_ID}" --body-file /tmp/result.md
