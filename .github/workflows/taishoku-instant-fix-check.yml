name: taishoku-instant-fix-check
on:
  push:
    branches:
      - fix/taishoku-instant-finalize-timeout-20260917
      - taishoku-production-free
  pull_request:
    branches:
      - taishoku-production-free
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build application from real bundled runtime
        run: bash taishoku_app/build.sh
      - name: Validate review-only partial guidance and durable fallback
        run: node taishoku_app/tests/partial_guidance.test.mjs
      - name: Validate safe failure handling and normal release guards
        shell: bash
        run: |
          set -euo pipefail
          F=taishoku_app/runtime/workflow_pipeline_v0.1/instant_finalize.mjs
          W=taishoku_app/runtime/workflow_webhook_v0.1/webhook_server.mjs
          P=taishoku_app/runtime/workflow_persistence_v0.1/persist_job.mjs
          A=taishoku_app/runtime/workflow_report_access_v0.1/report_access.mjs
          grep -q "status === 'review_required'" "$F"
          grep -q 'instant_finalize_timeout:' "$F"
          grep -q 'instantReportFailed(outputRoot, token)' "$W"
          grep -q 'reportUnavailablePage(outputRoot, token, durableReview)' "$W"
          grep -q 'safeResolvePendingReview(token)' "$W"
          grep -q 'ここだけ確認してください' "$W"
          grep -q '次に確認すること' "$W"
          grep -q '送信できました' "$W"
          ! grep -q '回答を整理しています' "$W"
          ! grep -q '入力した内容をもとに整理した目安' "$F"
          grep -q "state?.status === 'review_required'" "$W"
          grep -q 'export async function resolvePendingReview(token)' "$A"
          grep -q "field->>'value' = \$1" "$A"
          grep -q "j.status = 'review_required'" "$A"
          grep -q "'review_required'" "$P"
          grep -q 'automatic_delivery: false' "$W"
          grep -q 'approved_for_manual_delivery' "$A"
          grep -q 'data-taishoku-report-caution="v1"' "$F"
          grep -q '厚生労働省「基本手当について」' "$F"
          grep -q '傷病手当金の公式案内' "$F"
          grep -q '退職後の健康保険の公式案内' "$F"
          grep -q '年金加入の公式案内' "$F"
          node --check "$F"
          node --check "$W"
          node --check "$P"
          node --check "$A"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { finalizeInstantReport } from './taishoku_app/runtime/workflow_pipeline_v0.1/instant_finalize.mjs';
          const finalizerSource = fs.readFileSync('./taishoku_app/runtime/workflow_pipeline_v0.1/instant_finalize.mjs','utf8');
          assert.ok(finalizerSource.indexOf('addReportCaution(jobDir);') > -1,'caution insertion missing');
          assert.ok(finalizerSource.indexOf('addReportCaution(jobDir);') < finalizerSource.indexOf('const result = await approve('),'caution must be fixed before approval snapshot');
          const root = fs.mkdtempSync(path.join(os.tmpdir(),'taishoku-regression-'));
          const token = crypto.randomBytes(32).toString('base64url');
          const ref = 'WF-test-review';
          const job = path.join(root, ref);
          fs.mkdirSync(job);
          fs.writeFileSync(path.join(job,'job_manifest.json'),JSON.stringify({status:'review_required',delivery_allowed:false,automatic_delivery:false}));
          let blocked=false;
          try { await finalizeInstantReport({outputRoot:root,referenceId:ref,token,timeoutMs:250}); }
          catch(e) { blocked=String(e.message).includes('job_not_publishable:review_required'); }
          assert.equal(blocked,true,'review_required must fail immediately');
          assert.equal(fs.existsSync(path.join(job,'approval.json')),false,'review_required must not be approved');
          fs.rmSync(root,{recursive:true,force:true});
          console.log('REVIEW_REQUIRED_FAIL_CLOSED_OK');
          JS
          echo INSTANT_FIX_CHECK_OK
