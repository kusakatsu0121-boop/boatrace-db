name: Gender true and makuri analysis
on:
  push:
    paths:
      - 'gender_true_and_makuri_analysis.py'
      - '.github/workflows/gender-true-makuri.yml'
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
      - run: python -m pip install --disable-pip-version-check pandas numpy requests
      - run: python gender_true_and_makuri_analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: gender-true-makuri
          path: artifacts/gender_true_makuri