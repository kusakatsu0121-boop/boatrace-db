name: Ongaeshi analysis
on:
  push:
    paths:
      - 'ongaeshi_analysis.py'
      - '.github/workflows/ongaeshi-analysis.yml'
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - run: python ongaeshi_analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: ongaeshi-analysis
          path: artifacts/ongaeshi_analysis
