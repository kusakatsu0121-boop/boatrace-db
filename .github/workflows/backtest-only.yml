name: Fast leakage-safe EV backtest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout model code
        uses: actions/checkout@v4
      - name: Checkout public boat-race data
        uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
          fetch-depth: 1
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run July discovery August OOS backtest
        shell: bash
        run: |
          set -o pipefail
          python backtest_ev_jul_aug.py | tee /tmp/backtest.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ev-backtest-jul-aug
          path: artifacts/backtest_ev_jul_aug/*.csv
          retention-days: 30
      - name: Publish result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/result.md
          import pandas as pd
          s=pd.read_csv('artifacts/backtest_ev_jul_aug/summary.csv')
          meta=pd.read_csv('artifacts/backtest_ev_jul_aug/fold_meta.csv')
          primary=s[s['strategy'].eq('EV1.15_TOP1')]
          print('July discovery -> untouched August EV backtest completed.')
          print('')
          print('Primary: EV >= 1.15, max 1 bet/race, fixed 100 yen.')
          print('```')
          print(primary.to_string(index=False))
          print('```')
          print('')
          print('Fold meta:')
          print('```')
          print(meta.to_string(index=False))
          print('```')
          PY
          gh issue create --title "July-Aug EV backtest result ${GITHUB_RUN_ID}" --body-file /tmp/result.md
