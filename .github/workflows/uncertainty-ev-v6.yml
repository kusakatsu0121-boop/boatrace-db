name: Uncertainty-adjusted EV v6

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout model code
        uses: actions/checkout@v4
      - name: Checkout public boat-race data
        uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
          fetch-depth: 1
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn
      - name: Run uncertainty-adjusted EV V6
        shell: bash
        run: |
          set -o pipefail
          python uncertainty_ev_v6.py | tee /tmp/uncertainty-v6.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: uncertainty-ev-v6
          path: artifacts/uncertainty_ev_v6/*.csv
          retention-days: 30
      - name: Publish result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/result.md
          import pandas as pd
          for name in ['meta','july_ev_reliability','model_quality','sensitivity','robustness','edge_summary']:
              p=f'artifacts/uncertainty_ev_v6/{name}.csv'
              print(f'\n## {name}')
              print('```')
              print(pd.read_csv(p).to_string(index=False))
              print('```')
          PY
          gh issue create --title "Uncertainty-adjusted EV V6 ${GITHUB_RUN_ID}" --body-file /tmp/result.md
