name: Inya impact quick
on:
  push:
    paths:
      - 'inya_impact_quick.py'
      - '.github/workflows/inya-impact-quick.yml'
      - 'inya_impact_trigger.txt'
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - run: python inya_impact_quick.py
      - uses: actions/upload-artifact@v4
        with:
          name: inya-impact-quick
          path: artifacts/inya_impact_quick
