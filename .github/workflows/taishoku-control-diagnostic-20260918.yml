name: Taishoku public form controls diagnostic (read only)
on:
  push:
    branches: [test/taishoku-free-live-e2e-20260918]
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.head_commit.message == 'Diagnose required fields before submit without sending [20260918]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/control-check && cd /tmp/control-check
          npm init -y >/dev/null
          npm install --silent playwright@1.55.1
          npx playwright install --with-deps chromium >/dev/null
          cat > inspect.mjs <<'JS'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true});
          const page=await b.newPage({viewport:{width:390,height:844}});
          try {
            await page.goto('https://taishoku-workflow-production-free.onrender.com/start',{waitUntil:'domcontentloaded',timeout:90000});
            await page.getByText('あなた専用｜退職前後ワークフロー',{exact:true}).first().waitFor();
            const select=async(text)=>{const el=page.getByText(text,{exact:true}).first();await el.waitFor({state:'visible'});await el.evaluate(n=>n.click());};
            await page.getByPlaceholder('例：ニックネーム',{exact:true}).fill('自動テスト_20260918');
            await select('通常勤務中');
            await select('仕事内容が合わない・今後のキャリア');
            const health=page.getByRole('combobox').nth(0);
            console.log('HEALTH_VISIBLE',await health.isVisible());
            await health.click({force:true});
            console.log('HEALTH_OPTIONS',JSON.stringify(await page.getByRole('option').allTextContents()));
            await page.getByRole('option',{name:'始められそう'}).click();
            await select('まだ決まっていない');
            await page.getByPlaceholder('例：42',{exact:true}).fill('38');
            const insurance=page.getByRole('combobox').nth(1);
            await insurance.click({force:true});
            await page.getByRole('option',{name:'1年以上5年未満'}).click();
            await select('まだ何も伝えていない');
            await select('ない');
            await select('キャリア・仕事内容');
            await select('仕事を探すつもり');
            await select('6か月分の合計額を入力する');
            await page.getByPlaceholder('例：1800000',{exact:true}).fill('1800000');
            await select('失業手当の金額と受け取り方');
            await select('いいえ');
            await select('回答内容をもとに、個別レポートを作成することに同意します。\n給与や離職理由の最終決定、申請代行、会社との交渉を行うサービスではないことを確認しました。');
            console.log('INVALID_FIELDS',JSON.stringify(await page.locator('input:invalid,textarea:invalid,select:invalid').evaluateAll(nodes=>nodes.map(n=>({type:n.type,id:n.id,role:n.getAttribute('role'),required:n.required,outer:n.outerHTML.slice(0,300)})).slice(0,40))));
            console.log('UNSELECTED_REQUIRED',JSON.stringify(await page.locator('input[required]').evaluateAll(nodes=>nodes.filter(n=>(n.type==='checkbox'||n.type==='radio')&&!Array.from(document.getElementsByName(n.name)).some(x=>x.checked)).map(n=>({name:n.name,type:n.type})).slice(0,20))));
            console.log('FORM_VALID',await page.locator('form').evaluateAll(nodes=>nodes.map(n=>n.checkValidity())));
            console.log('NO_SUBMISSION');
          }finally{await b.close();}
          JS
          node inspect.mjs
