name: Taishoku public form controls diagnostic (read only)
on:
  push:
    branches: [test/taishoku-free-live-e2e-20260918]
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.head_commit.message == 'Diagnose insurance dropdown specifically [20260918]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/control-check && cd /tmp/control-check
          npm init -y >/dev/null
          npm install --silent playwright@1.55.1
          npx playwright install --with-deps chromium >/dev/null
          cat > inspect.mjs <<'JS'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true});
          const page=await b.newPage({viewport:{width:390,height:844}});
          try {
            await page.goto('https://taishoku-workflow-production-free.onrender.com/start',{waitUntil:'domcontentloaded',timeout:90000});
            await page.getByText('あなた専用｜退職前後ワークフロー',{exact:true}).first().waitFor();
            await page.getByText('通常勤務中',{exact:true}).first().evaluate(el=>el.click());
            const boxes=page.getByRole('combobox');
            console.log('COUNT',await boxes.count());
            for(let i=0;i<await boxes.count();i++){
              const el=boxes.nth(i);
              console.log('BOX',i,JSON.stringify(await el.evaluate(n=>({id:n.id,label:document.getElementById(n.getAttribute('aria-labelledby'))?.innerText,parent:n.parentElement?.parentElement?.innerText.slice(0,300),outer:n.outerHTML.slice(0,300)}))));
            }
            const box=boxes.nth(1);
            await box.click({force:true});
            console.log('EXPANDED',await box.getAttribute('aria-expanded'));
            console.log('OPTIONS',await page.getByRole('option').count());
            console.log('MATCH',await page.getByText('1年以上5年未満',{exact:true}).count());
            console.log('LISTBOX',JSON.stringify((await page.locator('[role="listbox"]').evaluateAll(nodes=>nodes.map(n=>n.outerHTML.slice(0,1600))))));
            console.log('BODY_END',JSON.stringify((await page.locator('body').innerText()).slice(0,1700)));
            console.log('NO_SUBMISSION');
          }finally{await b.close();}
          JS
          node inspect.mjs
