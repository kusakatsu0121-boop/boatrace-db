name: Forward pre-race snapshot capture

on:
  schedule:
    # 08:00-22:59 JST. Public od3 snapshots are normally taken about 10 min pre-deadline.
    - cron: '*/5 23,0-13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forward-pre-race-snapshot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout model repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout live public boat-race snapshots
        uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
          fetch-depth: 1
      - name: Capture upcoming races only
        env:
          MIN_DEADLINE_BUFFER_MINUTES: '4'
        run: python capture_forward_snapshot.py
      - name: Commit immutable pre-race snapshots
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- forward_snapshots)" ]; then
            echo 'No new eligible pre-race snapshots.'
            exit 0
          fi
          git config user.name 'boatrace-forward-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add forward_snapshots
          git commit -m 'Capture pre-race forward snapshots [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
