name: taishoku-bundle-audit

on:
  push:
    branches:
      - taishoku-neon-persistence

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and audit approval/webhook flow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/taishoku-audit && mkdir -p /tmp/taishoku-audit
          cat taishoku_app/bundle/part*.txt | base64 -d > /tmp/app.zip
          unzip -q /tmp/app.zip -d /tmp/taishoku-audit
          echo '=== TOP LEVEL ==='
          find /tmp/taishoku-audit -maxdepth 2 -type f | sort
          echo '=== APPROVE JOB ==='
          sed -n '1,360p' /tmp/taishoku-audit/workflow_pipeline_v0.1/approve_job.mjs
          echo '=== ORIGINAL WEBHOOK SERVER ==='
          sed -n '1,380p' /tmp/taishoku-audit/workflow_webhook_v0.1/webhook_server.mjs
