name: taishoku-bundle-audit

on:
  push:
    branches:
      - taishoku-neon-persistence

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and audit report access and approval flow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/taishoku-audit && mkdir -p /tmp/taishoku-audit
          cat taishoku_app/bundle/part*.txt | base64 -d > /tmp/app.zip
          unzip -q /tmp/app.zip -d /tmp/taishoku-audit
          echo '=== REPORT ACCESS MODULE ==='
          sed -n '1,320p' /tmp/taishoku-audit/workflow_report_access_v0.1/report_access.mjs
          echo '=== APPROVE JOB ==='
          sed -n '1,320p' /tmp/taishoku-audit/workflow_pipeline_v0.1/approve_job.mjs
          echo '=== ORIGINAL WEBHOOK SERVER REPORT ROUTES ==='
          grep -n "report_access\|/r/\|resolveReport\|serveReport" /tmp/taishoku-audit/workflow_webhook_v0.1/webhook_server.mjs || true
          sed -n '1,340p' /tmp/taishoku-audit/workflow_webhook_v0.1/webhook_server.mjs
