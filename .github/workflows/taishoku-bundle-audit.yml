name: taishoku-bundle-audit

on:
  push:
    branches:
      - taishoku-neon-persistence

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and audit legal/report version
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/taishoku-audit && mkdir -p /tmp/taishoku-audit
          cat taishoku_app/bundle/part*.txt | base64 -d > /tmp/app.zip
          unzip -q /tmp/app.zip -d /tmp/taishoku-audit
          echo '=== TEMPLATE VERSION ==='
          grep -R -n "TEMPLATE_VERSION" /tmp/taishoku-audit/report_template_v0.1 || true
          echo '=== RETIREMENT BENEFIT NOTICE ==='
          grep -R -n "退職給付金" /tmp/taishoku-audit/report_template_v0.1 || true
          echo '=== REQUIRED SOURCE URLS ==='
          grep -R -n "0000160564_00050\|naha_retirement_benefits_202603\|n-20251203_1" /tmp/taishoku-audit || true
          echo '=== VERIFIED AT ==='
          grep -R -n '"verified_at"' /tmp/taishoku-audit/workflow_rule_package_v0.1 || true
          echo '=== FILE LIST ==='
          find /tmp/taishoku-audit -maxdepth 2 -type f | sort
