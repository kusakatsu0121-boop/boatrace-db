name: taishoku-bundle-audit

on:
  push:
    branches:
      - taishoku-neon-persistence

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and audit legal/report version
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/taishoku-audit && mkdir -p /tmp/taishoku-audit
          cat taishoku_app/bundle/part*.txt | base64 -d > /tmp/app.zip
          unzip -q /tmp/app.zip -d /tmp/taishoku-audit
          R=/tmp/taishoku-audit/report_template_v0.1/render_report.py
          J=/tmp/taishoku-audit/workflow_rule_package_v0.1/workflow_rules_v0.1.json
          echo '=== VERSION/SOURCES TOP ==='
          sed -n '1,110p' "$R"
          echo '=== BENEFIT STRING LOCATIONS ==='
          grep -n "失業手当\|基本手当\|SOURCE_URLS\|source_urls" "$R" || true
          echo '=== RENDER BODY 250-430 ==='
          sed -n '250,430p' "$R"
          echo '=== RULES TOP ==='
          sed -n '1,30p' "$J"
          echo '=== RULES SOURCES TAIL ==='
          sed -n '155,195p' "$J"
