name: Edogawa muscle scan
on:
  workflow_dispatch:
  push:
    paths:
      - "edogawa_muscle_scan.py"
      - ".github/workflows/edogawa-muscle-scan.yml"
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - run: python edogawa_muscle_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edogawa-muscle-scan
          path: artifacts/edogawa_muscle_scan
