name: Taishoku free live end-to-end test (isolated)
on:
  push:
    branches: [test/taishoku-free-live-e2e-20260918]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Confirm live public endpoint safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error, time
          root='https://taishoku-workflow-production-free.onrender.com'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=urllib.request.build_opener(NoRedirect())
          def request(path):
              req=urllib.request.Request(root+path,headers={'User-Agent':'taishoku-free-smoke/1.0'})
              for attempt in range(3):
                  try:
                      with opener.open(req,timeout=50) as res: return res.status,res.headers,res.read(15000)
                  except urllib.error.HTTPError as e:
                      if e.code in (502,503,504) and attempt<2: time.sleep(8);continue
                      return e.code,e.headers,e.read(15000)
          status,_,body=request('/health')
          assert status==200,('health',status)
          health=json.loads(body)
          assert health['automatic_delivery'] is False
          assert health['persistence']=='configured'
          assert health['secret_report_access']=='configured'
          assert health['instant_web_report']=='enabled'
          print('PASS health: persistent/secret/instant enabled; automatic delivery disabled')
          status,headers,_=request('/start')
          location=headers.get('Location','')
          assert status==302 and location.startswith('https://tally.so/r/QKyVpY?'),('start',status)
          assert re.search(r'(?<![A-Za-z0-9_])instant_token=[A-Za-z0-9_-]{43}(?:&|$)',location)
          print('PASS start: redirect and 43-character random token (token withheld)')
          status,_,_=request('/r/not-a-token')
          assert status==404,('invalid-token',status)
          print('PASS invalid token: 404')
          PY
      - name: Install browser on GitHub public runner (not TinyFish)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/taishoku-e2e
          cd /tmp/taishoku-e2e
          npm init -y >/dev/null
          npm install --silent playwright@1.55.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Inspect published form without submitting anything
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/taishoku-e2e
          cat > inspect.mjs <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage();
            await page.goto('https://taishoku-workflow-production-free.onrender.com/start',{waitUntil:'domcontentloaded',timeout:90000});
            await page.getByText('あなた専用｜退職前後ワークフロー',{exact:true}).first().waitFor({timeout:30000});
            const url=new URL(page.url());
            assert.equal(url.hostname,'tally.so');
            assert.match(url.searchParams.get('instant_token')||'',/^[A-Za-z0-9_-]{43}$/);
            const inputs=await page.locator('input').evaluateAll(nodes=>nodes.map(n=>({type:n.type,placeholder:n.placeholder,role:n.getAttribute('role'),aria:n.getAttribute('aria-label')})).slice(0,30));
            const comboboxes=await page.getByRole('combobox').count();
            const buttons=await page.getByRole('button').allTextContents();
            console.log('PASS published browser form opened with instant token (token withheld)');
            console.log('VISIBLE_INPUT_SCHEMA',JSON.stringify(inputs));
            console.log('COMBOBOX_COUNT',comboboxes);
            console.log('BUTTON_LABELS',JSON.stringify(buttons.slice(0,30)));
            console.log('PUBLIC_FORM_TEXT_PREVIEW',JSON.stringify((await page.locator('body').innerText()).slice(0,3500)));
            console.log('NO_FORM_SUBMISSION_PERFORMED');
          } finally { await browser.close(); }
          JS
          node inspect.mjs
