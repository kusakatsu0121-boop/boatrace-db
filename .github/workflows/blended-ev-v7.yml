name: Calibrated blended EV v7

on:
  push:
    paths:
      - 'blended_ev_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
          fetch-depth: 1
      - run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn
      - run: python blended_ev_v7.py
      - uses: actions/upload-artifact@v4
        with:
          name: blended-ev-v7
          path: artifacts/blended_ev_v7/*.csv
          retention-days: 30
      - name: Publish issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Frozen V7 calibrated-EV audit'
            echo 'Architecture and blend weight were fixed before reading August ROI. July score quantiles only set purchase volume.'
            echo '```'
            cat artifacts/blended_ev_v7/summary.csv
            echo '```'
          } > /tmp/body.md
          gh issue create --title "Blended EV V7 ${GITHUB_RUN_ID}" --body-file /tmp/body.md
