name: Core-first feature family ablation v7

on:
  push:
    paths:
      - 'ablation_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout model code
        uses: actions/checkout@v4
      - name: Checkout public boat-race data
        uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
          fetch-depth: 1
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn
      - name: Run core-first ablation
        shell: bash
        run: |
          set -o pipefail
          python core_feature_ablation_v7.py | tee /tmp/core-ablation.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: core-feature-ablation-v7
          path: artifacts/core_feature_ablation_v7/*.csv
          retention-days: 30
      - name: Publish result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/result.md
          import pandas as pd
          for name in ['family_diagnostics','model_comparison','full_coefficient_mass','venue_model_weights','compact_venue_compare','meta']:
              p=f'artifacts/core_feature_ablation_v7/{name}.csv'
              print(f'\n## {name}')
              print('```')
              print(pd.read_csv(p).to_string(index=False))
              print('```')
          PY
          gh issue create --title "Core-first feature ablation V7 ${GITHUB_RUN_ID}" --body-file /tmp/result.md
