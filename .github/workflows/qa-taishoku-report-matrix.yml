name: Inspect retirement report template
on:
  push:
    branches: [qa/taishoku-report-matrix-20261012]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash taishoku_app/build.sh
      - name: Show template
        run: sed -n '1,180p' taishoku_app/runtime/report_template_v0.1/report_template.html
