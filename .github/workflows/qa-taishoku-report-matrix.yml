name: QA retirement report matrix
on:
  push:
    branches: [qa/taishoku-report-matrix-20261012]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash taishoku_app/build.sh
      - name: Inspect renderer API
        shell: bash
        run: |
          set -euo pipefail
          R=taishoku_app/runtime/report_template_v0.1/render_report.py
          echo '=== RENDER FUNCTIONS ==='
          grep -n '^def ' "$R"
          echo '=== RENDER FUNCTION ==='
          grep -n -A180 '^def render' "$R" || true
          echo '=== FILE TAIL ==='
          tail -140 "$R"
