name: Boat EV quick scan

on:
  workflow_dispatch:
  push:
    paths:
      - 'advisor_ev_quick.py'
      - 'advisor_ev_quick_trigger*.txt'

permissions:
  contents: read

jobs:
  ev-quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - run: python advisor_ev_quick.py
      - uses: actions/upload-artifact@v4
        with:
          name: advisor-ev-quick
          path: artifacts/advisor_ev_quick
