name: Public DB quick export

on:
  workflow_dispatch:
  push:
    paths:
      - public_db_now.py
      - .github/workflows/public-db-now.yml
      - public_db_now_trigger.txt

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - run: python public_db_now.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-db-now
          path: artifacts/public_db_now
