name: Inspect taishoku output clarity
on:
  push:
    branches: [fix/taishoku-output-clarity-20261010]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash taishoku_app/build.sh
      - name: Print relevant renderer and rule sections
        shell: bash
        run: |
          set -euo pipefail
          R=taishoku_app/runtime/report_template_v0.1/render_report.py
          T=taishoku_app/runtime/report_template_v0.1/report_template.html
          E=taishoku_app/runtime/workflow_rule_package_v0.1/evaluate.mjs
          P=taishoku_app/runtime/workflow_pipeline_v0.1/process_tally_submission.mjs
          echo '=== renderer 1-460 ==='
          sed -n '1,460p' "$R"
          echo '=== template ==='
          sed -n '1,180p' "$T"
          echo '=== evaluate 1-430 ==='
          sed -n '1,430p' "$E"
          echo '=== process submission 35-165 ==='
          sed -n '35,165p' "$P"
          echo '=== claim-state terms across runtime ==='
          grep -RInE '申請中|申請済|受給中|未申請|not_applied|applied|receiving|claim_status|application_status|sickness.*status|benefit.*status' taishoku_app/runtime \
            --include='*.mjs' --include='*.js' --include='*.py' --include='*.json' | head -500 || true
          echo '=== sickness status schema ==='
          sed -n '225,245p' taishoku_app/runtime/workflow_rule_package_v0.1/answer.schema.json
          echo '=== sickness status map ==='
          sed -n '318,342p' taishoku_app/runtime/workflow_rule_package_v0.1/tally_field_map.v1.json
          echo '=== process missing flow ==='
          sed -n '45,165p' "$P"
          echo '=== employment reason missing logic ==='
          grep -n -B18 -A45 -E "overtime_evidence|reason_causation|EI_REASON_NEED_FACTS|EI_REASON_TOKUTEI" "$E" | head -260 || true
