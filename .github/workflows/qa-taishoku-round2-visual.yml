name: QA retirement round2 visual
on:
  push:
    branches: [qa/taishoku-round2-visual-20261014]
    paths-ignore: ['taishoku_app/qa_output/**']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash taishoku_app/build.sh
      - run: python3 taishoku_app/tests/qa_round2_visual.py
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Capture mobile
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for f in taishoku_app/qa_output/round2_visual/*/report.html; do
            d="$(dirname "$f")"
            "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=375,1800 --screenshot="$d/mobile.png" "file://$GITHUB_WORKSPACE/$f"
            base64 -w0 "$d/mobile.png" > "$d/mobile.png.b64"
          done
      - name: Assert
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('taishoku_app/qa_output/round2_visual/summary.json').read_text())
          assert all(x['sickness_before_unemployment'] for x in r)
          clean=next(x for x in r if x['case']=='clean_done')
          assert 'ACT-POST-VC' not in clean['task_ids']
          assert all(not x['warning_has_mynaportal'] for x in r)
          assert all(not x['has_old_h1'] for x in r)
          print(r)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add taishoku_app/qa_output/round2_visual
          git diff --cached --quiet || (git commit -m "Add round2 retirement visual QA outputs" && git push)
