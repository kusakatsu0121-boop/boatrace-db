name: Gender inner effect analysis
on:
  push:
    paths:
      - 'gender_inner_effect_analysis.py'
      - '.github/workflows/gender-inner-effect.yml'
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - run: python gender_inner_effect_analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: gender-inner-effect
          path: artifacts/gender_inner_effect/
