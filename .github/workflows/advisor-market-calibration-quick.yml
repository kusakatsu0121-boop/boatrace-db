name: Boat market calibration quick

on:
  workflow_dispatch:
  push:
    paths:
      - 'advisor_market_calibration_quick.py'
      - 'advisor_market_calibration_trigger*.txt'

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - run: python advisor_market_calibration_quick.py
      - uses: actions/upload-artifact@v4
        with:
          name: advisor-market-calibration-quick
          path: artifacts/advisor_market_calibration_quick
