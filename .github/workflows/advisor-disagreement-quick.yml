name: Boat disagreement quick

on:
  workflow_dispatch:
  push:
    paths:
      - 'advisor_disagreement_quick.py'
      - 'advisor_disagreement_trigger*.txt'

permissions:
  contents: read

jobs:
  disagreement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - run: python advisor_disagreement_quick.py
      - uses: actions/upload-artifact@v4
        with:
          name: advisor-disagreement-quick
          path: artifacts/advisor_disagreement_quick
