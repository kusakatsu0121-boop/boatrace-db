name: Boat weight holdout validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'advisor_weight_holdout.py'
      - 'advisor_weight_holdout_trigger*.txt'

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - run: python advisor_weight_holdout.py
      - uses: actions/upload-artifact@v4
        with:
          name: advisor-weight-holdout
          path: artifacts/advisor_weight_holdout
