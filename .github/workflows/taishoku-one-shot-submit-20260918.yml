name: Taishoku synthetic one-shot actual submission
on:
  push:
    branches: [test/taishoku-free-live-e2e-20260918]
permissions:
  contents: read
jobs:
  submit-once:
    if: github.event.head_commit.message == 'Run synthetic end-to-end submission once [insurance dropdown verified]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install browser on GitHub runner without TinyFish
        run: |
          mkdir -p /tmp/taishoku-one-shot && cd /tmp/taishoku-one-shot
          npm init -y >/dev/null
          npm install --silent playwright@1.55.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Submit one synthetic form and verify report
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/taishoku-one-shot
          cat > test.mjs <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const root='https://taishoku-workflow-production-free.onrender.com';
          const browser=await chromium.launch({headless:true});
          let stage='start',submitClicked=false;
          try {
            const page=await browser.newPage({viewport:{width:390,height:844}});
            page.setDefaultTimeout(18000);
            await page.goto(root+'/start',{waitUntil:'domcontentloaded',timeout:90000});
            await page.getByText('あなた専用｜退職前後ワークフロー',{exact:true}).first().waitFor();
            assert.match(new URL(page.url()).searchParams.get('instant_token')||'',/^[A-Za-z0-9_-]{43}$/);
            console.log('PASS opening published Tally with generated token (not printed)');
            const select=async(text)=>{
              stage='select: '+text;
              const label=page.getByText(text,{exact:true}).first();
              await label.waitFor({state:'visible'});
              const checked=await label.evaluate(el=>{const node=el.closest('label')||el;node.click();return node.control?.checked ?? document.getElementById(node.getAttribute('for'))?.checked ?? false;});
              assert.equal(checked,true,`could not select ${text}`);
            };
            const fill=async(placeholder,value)=>{stage='fill: '+placeholder;await page.getByPlaceholder(placeholder,{exact:true}).fill(value);};
            await fill('例：ニックネーム','自動テスト_20260918');
            await select('通常勤務中');
            await select('仕事内容が合わない・今後のキャリア');
            await select('まだ決まっていない');
            await fill('例：42','38');
            stage='insurance dropdown';
            const insurance=page.getByRole('combobox').nth(1);
            assert.equal(await insurance.getAttribute('aria-labelledby'),'label_18238c9c-3b3d-4f52-9af1-89ccf0a43020');
            await insurance.click({force:true});
            await page.getByRole('option',{name:'1年以上5年未満'}).click();
            assert.equal(await insurance.inputValue(),'1年以上5年未満');
            await select('まだ何も伝えていない');
            await select('ない');
            await select('キャリア・仕事内容');
            await select('仕事を探すつもり');
            await select('6か月分の合計額を入力する');
            await fill('例：1800000','1800000');
            await select('失業手当の金額と受け取り方');
            await select('いいえ');
            await select('回答内容をもとに、個別レポートを作成することに同意します。\n給与や離職理由の最終決定、申請代行、会社との交渉を行うサービスではないことを確認しました。');
            console.log('PASS synthetic answers, all required items selected');
            stage='submit';
            submitClicked=true;
            await page.getByRole('button',{name:'無料レポートを申し込む'}).click({force:true});
            await page.waitForURL(url=>url.hostname==='taishoku-workflow-production-free.onrender.com'&&url.pathname.startsWith('/r/'),{timeout:90000});
            const reportUrl=page.url();
            console.log('PASS submitted once and redirected to report URL (token not printed)');
            stage='result';
            let status=0,html='';
            for(let i=0;i<35;i++){
              const response=await page.request.get(reportUrl,{timeout:45000});
              status=response.status();html=await response.text();
              if(status!==202&&!html.includes('あなたのレポートを作成しています'))break;
              await page.waitForTimeout(3500);
            }
            const formal=status===200&&html.includes('自動テスト_20260918')&&!html.includes('確認待ちの暫定道案内');
            const interim=html.includes('確認待ちの暫定道案内');
            console.log('RESULT',JSON.stringify({status,formal,interim,automatic_delivery:false}));
            assert.ok(formal,'final formal report not displayed');
            console.log('PASS FULL_LIVE_TALLY_TO_REPORT_E2E');
          }catch(e){
            console.error('E2E_FAILURE',JSON.stringify({stage,submitClicked,type:e?.name||'Error',message:String(e?.message||'').split('\n')[0].slice(0,160)}));
            process.exitCode=1;
          }finally{await browser.close();}
          JS
          node test.mjs
