name: Taishoku synthetic one-shot actual submission
on:
  push:
    branches: [test/taishoku-free-live-e2e-20260918]
permissions:
  contents: read
jobs:
  submit-once:
    if: github.event.head_commit.message == 'Run synthetic end-to-end submission once [one-shot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install browser locally on public GitHub runner (no TinyFish)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/taishoku-one-shot && cd /tmp/taishoku-one-shot
          npm init -y >/dev/null
          npm install --silent playwright@1.55.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Submit exactly one synthetic form and verify final rendered report
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/taishoku-one-shot
          cat > test.mjs <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const root='https://taishoku-workflow-production-free.onrender.com';
          const browser=await chromium.launch({headless:true});
          let stage='startup';
          let submitClicked=false;
          try {
            const page=await browser.newPage({viewport:{width:390,height:844}});
            page.setDefaultTimeout(18000);
            stage='open_form';
            await page.goto(root+'/start',{waitUntil:'domcontentloaded',timeout:90000});
            await page.getByText('あなた専用｜退職前後ワークフロー',{exact:true}).first().waitFor({timeout:30000});
            let tallyUrl=new URL(page.url());
            assert.equal(tallyUrl.hostname,'tally.so');
            assert.match(tallyUrl.searchParams.get('instant_token')||'',/^[A-Za-z0-9_-]{43}$/);
            console.log('PASS browser form opened with private token (withheld)');
            const pick=async (text)=>{stage='select_'+text;await page.getByText(text,{exact:true}).last().click();};
            const field=async (placeholder,value)=>{stage='fill_'+placeholder;await page.getByPlaceholder(placeholder,{exact:true}).fill(value);};
            await field('例：ニックネーム','自動テスト_20260918');
            await pick('通常勤務中');
            await pick('仕事内容が合わない・今後のキャリア');
            stage='dropdown_next_work';
            await page.getByRole('combobox').nth(0).click();
            await pick('始められそう');
            await pick('まだ決まっていない');
            await field('例：42','38');
            stage='dropdown_insured_period';
            await page.getByRole('combobox').nth(1).click();
            await pick('1年以上5年未満');
            await pick('まだ何も伝えていない');
            await pick('ない');
            await pick('キャリア・仕事内容');
            await pick('仕事を探すつもり');
            await pick('6か月分の合計額を入力する');
            await field('例：1800000','1800000');
            await pick('失業手当の金額と受け取り方');
            await pick('いいえ');
            stage='consent';
            await page.getByRole('checkbox').last().check();
            assert.equal(await page.getByRole('checkbox').last().isChecked(),true);
            console.log('PASS synthetic answers filled; consent checked');
            stage='submit';
            submitClicked=true;
            await page.getByRole('button',{name:'無料レポートを申し込む'}).click();
            await page.waitForURL(url=>url.hostname==='taishoku-workflow-production-free.onrender.com'&&url.pathname.startsWith('/r/'),{timeout:90000});
            const reportUrl=page.url();
            const reportToken=new URL(reportUrl).pathname.slice(3);
            assert.match(reportToken,/^[A-Za-z0-9_-]{43}$/);
            console.log('PASS Tally accepted submission and redirected to secret report URL (token withheld)');
            stage='report';
            let finalStatus=0,finalText='';
            for(let attempt=0;attempt<34;attempt++) {
              const response=await page.request.get(reportUrl,{timeout:45000});
              finalStatus=response.status();finalText=await response.text();
              if(finalStatus!==202 && !finalText.includes('あなたのレポートを作成しています')) break;
              await page.waitForTimeout(3500);
            }
            const hasInterim=finalText.includes('確認待ちの暫定道案内');
            const hasReport=finalStatus===200 && finalText.includes('自動テスト_20260918') && !hasInterim;
            console.log('REPORT_CHECK',JSON.stringify({http_status:finalStatus,interim:hasInterim,formal_report:hasReport,auto_delivery_intentionally_off:true}));
            assert.equal(hasReport,true,'submitted ordinary case must render formal report with synthetic nickname');
            console.log('PASS FULL LIVE FORM_TO_REPORT_E2E');
          } catch(error) {
            // Deliberately do not print URLs, tokens or form submission payloads.
            console.error('E2E_FAILURE',JSON.stringify({stage,submitClicked,errorType:error?.name||'Error',message:String(error?.message||'').split('\n')[0].slice(0,180)}));
            process.exitCode=1;
          } finally { await browser.close(); }
          JS
          node test.mjs
