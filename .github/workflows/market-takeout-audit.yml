name: Market takeout EV audit
on:
  workflow_dispatch:
  push:
    paths:
      - audit_market_takeout.py
      - .github/workflows/market-takeout-audit.yml
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
      - run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn
      - run: python audit_market_takeout.py
      - uses: actions/upload-artifact@v4
        with:
          name: market-takeout-audit
          path: artifacts/market_takeout_audit
