name: Boat QUICK weight search

on:
  workflow_dispatch:
  push:
    paths:
      - 'advisor_weight_quick.py'
      - 'advisor_weight_quick_trigger*.txt'

permissions:
  contents: read

jobs:
  weight-quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: source
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - run: python advisor_weight_quick.py
      - uses: actions/upload-artifact@v4
        with:
          name: advisor-weight-quick
          path: artifacts/advisor_weight_quick
